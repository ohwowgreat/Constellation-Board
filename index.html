<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Board</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
  --border: rgba(255,255,255,0.1); --border-hover: rgba(255,255,255,0.2);
  --text: #e8e8e8; --text-muted: #888;
  --accent: #FF4D00; --accent-dim: rgba(255,77,0,0.15);
  --canvas-bg: #141414; --handle: #FF4D00;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── BOARD BAR ── */
#board-bar {
  display: flex; align-items: center; gap: 0;
  background: #111; border-bottom: 1px solid var(--border);
  padding: 0 12px; flex-shrink: 0; overflow-x: auto; min-height: 38px;
}
#board-bar::-webkit-scrollbar { height: 3px; }
#board-bar::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }
#tabs-container { display: flex; align-items: stretch; flex-shrink: 0; }
.board-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 38px; cursor: pointer;
  font-size: 12px; color: var(--text-muted);
  border-right: 1px solid var(--border);
  white-space: nowrap; flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
  position: relative;
}
.board-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.board-tab.active { color: var(--text); background: var(--surface); }
.board-tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--accent);
}
.board-tab-name { outline: none; background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; max-width: 120px; }
.board-tab-name:focus { color: var(--text); border-bottom: 1px solid var(--accent); cursor: text; }
.board-tab .close-tab {
  font-size: 14px; color: var(--text-muted); line-height: 1;
  padding: 0 2px; border: none; background: transparent; cursor: pointer;
  opacity: 0; transition: opacity 0.15s, color 0.15s;
}
.board-tab:hover .close-tab, .board-tab.active .close-tab { opacity: 1; }
.board-tab .close-tab:hover { color: #ff6060; }
#add-board-btn {
  padding: 0 12px; height: 38px; font-size: 18px; line-height: 1;
  color: var(--text-muted); border: none; background: transparent;
  cursor: pointer; flex-shrink: 0; transition: color 0.15s;
}
#add-board-btn:hover { color: var(--accent); }
#sync-status {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em;
  color: var(--text-muted); padding: 0 10px; white-space: nowrap;
}
#sync-status::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted); flex-shrink: 0;
}
#sync-status.ok::before { background: #4caf50; }
#sync-status.busy::before { background: var(--accent); animation: sync-pulse 1s ease-in-out infinite; }
#sync-status.bad::before { background: #ff6060; }
#sync-status.bad { color: #ff8a8a; cursor: pointer; }
@keyframes sync-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
.board-actions {
  margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; padding-left: 12px;
}
.board-actions button {
  font-family: var(--sans); font-size: 11px; padding: 4px 10px;
  border-radius: 5px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.board-actions button:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.05); }

/* ── TOOLBAR ── */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.tool-group { display: flex; align-items: center; gap: 6px; padding-right: 12px; border-right: 1px solid var(--border); margin-right: 6px; }
.tool-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.app-title { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 8px; }

button { font-family: var(--sans); font-size: 12px; font-weight: 400; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s; white-space: nowrap; }
button:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.05); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
button.primary:hover { background: #e04400; border-color: #e04400; }
button.secondary { border-color: rgba(255,255,255,0.22); }
button.danger:hover { border-color: rgba(255,80,80,0.5); color: #ff6060; }

.toggle-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 10px; }
.toggle-btn .icon { width: 14px; height: 14px; border: 1.5px solid var(--text-muted); border-radius: 3px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s; }
.toggle-btn.active .icon { background: var(--accent); border-color: var(--accent); }
.toggle-btn.active .icon::after { content: ''; display: block; width: 7px; height: 4px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translateY(-1px); }

#count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-left: auto; }
.color-picker-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.swatch-row { display: flex; gap: 4px; }
.swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
.swatch:hover { transform: scale(1.15); border-color: var(--border-hover); }
.swatch.active { border-color: var(--accent); transform: scale(1.15); }
.custom-color { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); padding: 0; cursor: pointer; overflow: hidden; }

/* ── CANVAS & WORLD ── */
#canvas {
  flex: 1; position: relative; overflow: auto;
  background: var(--canvas-bg); transition: background 0.3s;
}
#canvas::-webkit-scrollbar { width: 8px; height: 8px; }
#canvas::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
#canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
#canvas::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
#canvas::-webkit-scrollbar-corner { background: rgba(0,0,0,0.2); }
#canvas.pan-ready { cursor: grab; }
#canvas.panning { cursor: grabbing; }

#world {
  position: relative;
  width: 4000px;
  height: 3000px;
  flex-shrink: 0;
}

.dot-grid { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }
#drop-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; transition: opacity 0.3s; z-index: 5; }
#drop-hint .hint-icon { width: 56px; height: 56px; border: 1.5px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
#drop-hint p { font-size: 13px; color: rgba(255,255,255,0.25); font-family: var(--mono); }
#drop-hover-overlay { display: none; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-dim); pointer-events: none; z-index: 1000; }
#canvas.drag-over #drop-hover-overlay { display: block; }

/* pan hint */
#pan-hint {
  position: absolute; bottom: 12px; right: 16px;
  font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.2);
  pointer-events: none; z-index: 5; user-select: none;
}

/* ── NODES ── */
.canvas-node { position: absolute; user-select: none; cursor: grab; }
.canvas-node:active { cursor: grabbing; }
.resize-handle { position: absolute; width: 10px; height: 10px; background: var(--bg); border: 1.5px solid var(--handle); border-radius: 2px; z-index: 10; display: none; }
.canvas-node.selected .resize-handle { display: block; }
.resize-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
.resize-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
.resize-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
.resize-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

.action-bar { position: absolute; top: -36px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; white-space: nowrap; z-index: 20; }
.canvas-node.selected .action-bar { display: flex; }
.action-bar button { font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.action-bar .sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }
.action-bar .size-readout { font-family: var(--mono); font-size: 10px; color: var(--text-muted); padding: 3px 6px; pointer-events: none; }

.img-node .img-inner { width: 100%; height: 100%; position: relative; }
.img-frame { width: 100%; height: 100%; overflow: hidden; border-radius: 6px; border: 1.5px solid transparent; transition: border-color 0.15s; }
.img-node.selected .img-frame { border-color: var(--accent); }
.img-frame img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.img-label { position: absolute; bottom: -26px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; transition: color 0.15s; display: none; }
.img-node.selected .img-label { color: var(--text); }
.labels-on .img-label { display: block; }

.text-node { min-width: 100px; }
.text-border { width: 100%; min-height: 40px; border: 1.5px solid transparent; border-radius: 6px; transition: border-color 0.15s; position: relative; }
.text-node.selected .text-border { border-color: var(--accent); }
.text-content { width: 100%; min-height: 36px; padding: 8px 10px; outline: none; font-family: var(--sans); font-size: 16px; font-weight: 400; color: #e8e8e8; line-height: 1.5; word-break: break-word; white-space: pre-wrap; cursor: text; background: transparent; border: none; display: block; box-sizing: border-box; }
.text-content:empty::before { content: attr(data-placeholder); color: rgba(255,255,255,0.2); pointer-events: none; }
.text-format-bar { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; white-space: nowrap; z-index: 21; }
.text-node.selected .text-format-bar { display: flex; }
.text-format-bar button { font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.text-format-bar .sep { width: 1px; height: 14px; background: var(--border); margin: 0 3px; }
.text-format-bar select { font-family: var(--sans); font-size: 11px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; cursor: pointer; }
.text-format-bar select option { background: #1a1a1a; }
.fmt-btn { font-weight: 600; min-width: 26px; text-align: center; }
.fmt-btn.active { background: rgba(255,77,0,0.2) !important; border-color: var(--accent) !important; color: var(--accent) !important; }

/* ── MODAL ── */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
#modal-overlay.open { display: flex; }
#modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; width: 340px; }
#modal h3 { font-size: 14px; font-weight: 500; margin-bottom: 14px; }
#modal input[type="text"] { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; margin-bottom: 16px; }
#modal input[type="text"]:focus { border-color: var(--accent); }
#modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
#modal .modal-btns button { font-size: 12px; padding: 6px 16px; }

#file-input { display: none; }
#import-input { display: none; }
</style>
</head>
<body>

<!-- BOARD TABS -->
<div id="board-bar">
  <div id="tabs-container"></div>
  <button id="add-board-btn" title="New board">+</button>
  <div class="board-actions">
    <span id="sync-status">Local only</span>
    <button id="sync-btn" title="Fetch the latest boards from the shared workspace">Sync</button>
    <button id="duplicate-board-btn">Duplicate</button>
    <button id="export-board-btn">Export JSON</button>
    <button id="export-pdf-btn">Export PDF</button>
    <button id="export-workspace-btn">Export All</button>
    <button id="import-btn">Import</button>
  </div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <span class="app-title">canvas</span>
  <div class="tool-group">
    <button class="primary" id="upload-btn">+ Images</button>
    <button class="secondary" id="text-btn">T+ Text</button>
  </div>
  <div class="tool-group">
    <button class="toggle-btn" id="aspect-btn"><span class="icon"></span>Lock ratio</button>
    <button class="toggle-btn" id="labels-btn"><span class="icon"></span>Labels</button>
  </div>
  <div class="tool-group color-picker-wrap">
    <span>BG</span>
    <div class="swatch-row" id="swatches">
      <div class="swatch active" style="background:#141414" data-color="#141414"></div>
      <div class="swatch" style="background:#1a1a2e" data-color="#1a1a2e"></div>
      <div class="swatch" style="background:#0d1f0d" data-color="#0d1f0d"></div>
      <div class="swatch" style="background:#f5f0e8" data-color="#f5f0e8"></div>
      <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
      <div class="swatch" style="background:#1a0a00" data-color="#1a0a00"></div>
    </div>
    <input type="color" class="custom-color" id="custom-bg" value="#141414">
  </div>
  <div class="tool-group">
    <button class="danger" id="clear-btn">Clear board</button>
  </div>
  <span id="count"></span>
</div>

<div id="canvas">
  <div id="world">
    <div class="dot-grid"></div>
  </div>
  <div id="drop-hover-overlay"></div>
  <div id="drop-hint">
    <div class="hint-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="8.5" cy="10.5" r="1.5"/>
        <path d="M3 16l5-5 4 4 3-3 6 5"/>
      </svg>
    </div>
    <p>drop images · click + images or T+ text to begin</p>
  </div>
  <div id="pan-hint">middle-click or space+drag to pan</div>
</div>

<input type="file" id="file-input" multiple accept="image/*">
<input type="file" id="import-input" accept=".json">

<!-- RENAME MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Rename board</h3>
    <input type="text" id="modal-input" placeholder="Board name">
    <div class="modal-btns">
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-confirm">OK</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// BOARD STATE
// ════════════════════════════════════════════════
// Boards used to live only in this browser, which is why two people could
// never open the same board. With config.js filled in they live in Supabase
// instead and localStorage becomes a plain offline cache.
const STORAGE_KEY = 'imagecanvas_boards_v1';         // local-only mode
const CACHE_KEY   = 'constellation_shared_cache_v1'; // offline copy of the shared workspace

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// boards = [{ id, name, bg, scrollX, scrollY, items: [...serialized] }]
let boards = [];
let activeBoardId = null;

function defaultBoard(name = 'Board 1') {
  return { id: uid(), name, bg: '#141414', scrollX: 0, scrollY: 0, items: [] };
}

// ════════════════════════════════════════════════
// REMOTE STORE - Supabase REST, no SDK
// ════════════════════════════════════════════════
const Remote = (() => {
  const cfg    = window.CONSTELLATION_CONFIG || {};
  const base   = String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  const key    = String(cfg.supabaseAnonKey || '');
  const bucket = cfg.bucket || 'board-images';
  const enabled = Boolean(base && key);
  const publicPrefix = enabled ? base + '/storage/v1/object/public/' : null;

  async function req(path, opts = {}) {
    const res = await fetch(base + path, {
      ...opts,
      headers: { apikey: key, Authorization: 'Bearer ' + key, ...(opts.headers || {}) }
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(((opts.method || 'GET') + ' ' + path + ' -> ' + res.status + ' ' + detail).trim());
    }
    return res;
  }

  const toRow = (b, i) => ({
    id: b.id, name: b.name || 'Board', bg: b.bg || '#141414',
    scroll_x: Math.round(b.scrollX || 0), scroll_y: Math.round(b.scrollY || 0),
    sort_order: i, items: b.items || []
  });
  const stampsOf = rows => Object.fromEntries((rows || []).map(r => [r.id, r.updated_at]));
  const fromRow = r => ({
    id: r.id, name: r.name, bg: r.bg,
    scrollX: r.scroll_x || 0, scrollY: r.scroll_y || 0,
    items: Array.isArray(r.items) ? r.items : []
  });

  return {
    enabled, bucket, publicPrefix,

    async fetchBoards() {
      const res = await req('/rest/v1/boards?select=*&order=sort_order.asc');
      const rows = await res.json();
      return { boards: rows.map(fromRow), stamps: stampsOf(rows) };
    },

    // Just the edit stamps, to check nobody overwrote us while we were working.
    async fetchStamps(ids) {
      if (!ids.length) return {};
      const list = ids.map(id => '"' + String(id).replace(/"/g, '') + '"').join(',');
      const res = await req('/rest/v1/boards?select=id,updated_at&id=in.(' + encodeURIComponent(list) + ')');
      return stampsOf(await res.json());
    },

    // entries: [{ board, index }] - index becomes sort_order, so tab order is shared too.
    async upsert(entries) {
      if (!entries.length) return {};
      const res = await req('/rest/v1/boards?select=id,updated_at', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify(entries.map(e => toRow(e.board, e.index)))
      });
      return stampsOf(await res.json().catch(() => []));
    },

    async remove(id) {
      await req('/rest/v1/boards?id=eq.' + encodeURIComponent(id),
                { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
    },

    async uploadImage(blob, filename) {
      const fromName = String(filename || '').match(/\.([a-z0-9]{1,5})$/i);
      const ext = (fromName ? fromName[1] : ((blob.type || '').split('/')[1] || 'png'))
        .toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'png';
      const path = uid() + '.' + ext;
      await req('/storage/v1/object/' + bucket + '/' + path, {
        method: 'POST',
        headers: { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true' },
        body: blob
      });
      return base + '/storage/v1/object/public/' + bucket + '/' + path;
    }
  };
})();

// ════════════════════════════════════════════════
// SYNC - debounced push, manual pull
// ════════════════════════════════════════════════
const Sync = (() => {
  const dirty = new Set();
  const deleted = new Set();
  let timer = null;
  let queue = Promise.resolve();
  let state = Remote.enabled ? 'idle' : 'local';
  let busyMsg = '';
  let detail = '';
  let savedAt = 0;
  const seen = {}; // board id -> the updated_at we last saw, to catch stale writes

  function render() {
    const node = document.getElementById('sync-status');
    if (!node) return;
    const labels = {
      local:   ['Local only', '',      'Boards live in this browser only. Fill in config.js to share them.'],
      idle:    ['Shared',     'ok',    'Connected to the shared workspace.'],
      loading: ['Loading',    'busy',  'Fetching boards from the shared workspace.'],
      saving:  ['Saving',     'busy',  'Pushing your changes to the shared workspace.'],
      saved:   ['Saved',      'ok',    'Every change is in the shared workspace.'],
      busy:    [busyMsg,      'busy',  busyMsg],
      error:   ['Not synced', 'bad',   'Could not reach the shared workspace. Click to retry.\n\n' + detail]
    };
    const spec = labels[state] || labels.idle;
    let label = spec[0];
    if (state === 'saved' && savedAt) {
      const mins = Math.floor((Date.now() - savedAt) / 60000);
      if (mins >= 1) label = 'Saved ' + mins + 'm ago';
    }
    node.textContent = label;
    node.className = spec[1];
    node.title = spec[2];
  }
  setInterval(render, 30000);

  function set(next, info) {
    state = next;
    if (next === 'error') detail = info || '';
    if (next === 'saved') savedAt = Date.now();
    render();
  }

  function schedule(ms) {
    if (!Remote.enabled) return;
    // Stay red once a push has failed: further edits are still not synced.
    if (state !== 'busy' && state !== 'loading' && state !== 'error') set('saving');
    clearTimeout(timer);
    timer = setTimeout(() => flush(), ms === undefined ? 900 : ms);
  }

  // Boards are written whole, so a push replaces whatever is on the server.
  // Rather than quietly dropping someone else's work, ask first.
  async function resolveConflicts(ids) {
    const known = ids.filter(id => seen[id]);
    if (!known.length) return ids;
    let stamps;
    try { stamps = await Remote.fetchStamps(known); }
    catch (err) { return ids; } // cannot check: fall back to last write wins
    const clashing = known.filter(id => stamps[id] && stamps[id] !== seen[id]);
    if (!clashing.length) return ids;

    const names = clashing.map(id => (boards.find(b => b.id === id) || {}).name || id).join(', ');
    const many = clashing.length > 1;
    const keepMine = confirm(
      'Someone else changed ' + (many ? 'these boards' : 'this board') + ' since you opened ' + (many ? 'them' : 'it') + ':\n\n' +
      names + '\n\n' +
      'OK\t\tkeep your version and replace theirs\n' +
      'Cancel\tdiscard your changes here and load theirs');
    if (keepMine) { clashing.forEach(id => { seen[id] = stamps[id]; }); return ids; }
    reloadWanted = true;
    return ids.filter(id => !clashing.includes(id));
  }

  let reloadWanted = false;

  async function runFlush() {
    if (!dirty.size && !deleted.size) return;
    if (activeBoardId) captureBoard(activeBoardId);

    let ids   = [...dirty];   dirty.clear();
    const gone = [...deleted]; deleted.clear();

    set('saving');
    try {
      ids = await resolveConflicts(ids);
      const entries = ids
        .map(id => ({ board: boards.find(b => b.id === id), index: boards.findIndex(b => b.id === id) }))
        .filter(e => e.board);
      for (const id of gone) { await Remote.remove(id); delete seen[id]; }
      Object.assign(seen, await Remote.upsert(entries));
      set('saved');
      if (reloadWanted) { reloadWanted = false; await reloadSharedWorkspace(); }
    } catch (err) {
      console.warn('Sync push failed', err);
      ids.forEach(id => dirty.add(id));
      gone.forEach(id => deleted.add(id));
      set('error', err.message || String(err));
      schedule(8000); // keep retrying quietly
    }
  }

  function flush() {
    if (!Remote.enabled) return queue;
    clearTimeout(timer); timer = null;
    queue = queue.then(runFlush, runFlush);
    return queue;
  }

  return {
    render,
    hasPending: () => dirty.size > 0 || deleted.size > 0,
    markDirty(id) { if (Remote.enabled && id) { dirty.add(id); schedule(); } },
    markAllDirty() { if (Remote.enabled) { boards.forEach(b => dirty.add(b.id)); schedule(); } },
    markDeleted(id) { if (Remote.enabled && id) { dirty.delete(id); deleted.add(id); schedule(); } },
    flushNow: flush,
    setBusy(msg) { busyMsg = msg; set('busy'); },
    clearBusy() { busyMsg = ''; set(dirty.size || deleted.size ? 'saving' : 'saved'); },
    async pull() {
      if (!Remote.enabled) return null;
      set('loading');
      try {
        const res = await Remote.fetchBoards();
        Object.keys(seen).forEach(k => delete seen[k]);
        Object.assign(seen, res.stamps);
        set('saved');
        return res.boards;
      }
      catch (err) {
        console.warn('Sync pull failed', err);
        set('error', err.message || String(err));
        return null;
      }
    }
  };
})();

function readBoardsFrom(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed) && parsed.length) return parsed; }
  } catch (e) {}
  return null;
}

function loadFromStorage() {
  boards = readBoardsFrom(Remote.enabled ? CACHE_KEY : STORAGE_KEY) || [defaultBoard('Board 1')];
}

function saveLocalCache() {
  const key = Remote.enabled ? CACHE_KEY : STORAGE_KEY;
  try { localStorage.setItem(key, JSON.stringify(boards)); }
  catch (e) { console.warn('Local cache write failed (quota?)', e); }
}

function saveToStorage() {
  if (activeBoardId) captureBoard(activeBoardId);
  saveLocalCache();
  Sync.markDirty(activeBoardId);
}

// Base64 images bloat every board row and are slow to hand to a second viewer,
// so move them into Storage and keep only the URL. Used on import and on the
// first upload of a browser's existing boards.
async function absorbDataUrls(board) {
  if (!Remote.enabled) return board;
  for (const item of board.items || []) {
    if (item && item.type === 'image' && typeof item.src === 'string' && item.src.startsWith('data:')) {
      try {
        const blob = await (await fetch(item.src)).blob();
        item.src = await Remote.uploadImage(blob, item.label);
      } catch (err) {
        console.warn('Could not move an image into Storage; leaving it inline', err);
      }
    }
  }
  return board;
}

// ════════════════════════════════════════════════
// SERIALIZE / DESERIALIZE NODES
// ════════════════════════════════════════════════
function serializeNodes() {
  return nodes.map(el => {
    const base = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight, z: parseInt(el.style.zIndex)||0 };
    if (el.classList.contains('img-node')) {
      return { ...base, type: 'image', src: el.querySelector('img').src, label: el.querySelector('.img-label').textContent, flipped: el.querySelector('.img-frame').style.transform === 'scaleX(-1)' };
    }
    if (el.classList.contains('text-node')) {
      const c = el.querySelector('.text-content');
      const tb = el.querySelector('.text-border');
      return { ...base, type: 'text', html: c.innerHTML,
        fontSize: c.style.fontSize || '16px', fontFamily: c.style.fontFamily || '',
        fontWeight: c.style.fontWeight || '400', fontStyle: c.style.fontStyle || 'normal',
        color: c.style.color || '#e8e8e8', bgColor: tb.style.background || 'transparent' };
    }
    return null;
  }).filter(Boolean);
}

function captureBoard(boardId) {
  const b = boards.find(b => b.id === boardId);
  if (!b) return;
  b.items = serializeNodes();
  b.bg = canvas.style.background || '#141414';
  b.scrollX = canvas.scrollLeft;
  b.scrollY = canvas.scrollTop;
}

function restoreBoard(b) {
  nodes.forEach(n => { try { world.removeChild(n); } catch(e){} });
  nodes = []; selected = null;

  const bg = b.bg || '#141414';
  canvas.style.background = bg;
  customBg.value = /^#[0-9a-f]{6}$/i.test(bg) ? bg : '#141414';
  updateDotGrid(bg);
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === bg));

  const items = [...(b.items || [])].sort((a,b) => a.z - b.z);
  items.forEach(item => {
    if (item.type === 'image') restoreImageNode(item);
    else if (item.type === 'text') restoreTextNode(item);
  });

  requestAnimationFrame(() => {
    canvas.scrollLeft = b.scrollX || 0;
    canvas.scrollTop = b.scrollY || 0;
  });

  updateCount();
}

// ════════════════════════════════════════════════
// TABS UI
// ════════════════════════════════════════════════
function renderTabs() {
  const container = document.getElementById('tabs-container');
  container.innerHTML = '';
  boards.forEach(b => {
    const tab = document.createElement('div');
    tab.className = 'board-tab' + (b.id === activeBoardId ? ' active' : '');
    tab.dataset.id = b.id;

    const nameEl = document.createElement('span');
    nameEl.className = 'board-tab-name';
    nameEl.textContent = b.name;
    nameEl.title = 'Double-click to rename';
    nameEl.addEventListener('dblclick', e => { e.stopPropagation(); openRenameModal(b.id); });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-tab';
    closeBtn.textContent = '×';
    closeBtn.title = 'Delete board';
    closeBtn.addEventListener('click', e => { e.stopPropagation(); deleteBoard(b.id); });

    tab.appendChild(nameEl);
    tab.appendChild(closeBtn);
    tab.addEventListener('click', () => switchBoard(b.id));
    container.appendChild(tab);
  });
}

function switchBoard(id) {
  if (id === activeBoardId) return;
  captureBoard(activeBoardId);
  Sync.markDirty(activeBoardId);
  activeBoardId = id;
  const b = boards.find(b => b.id === id);
  restoreBoard(b);
  renderTabs();
  saveLocalCache(); // cache only: opening a board is not an edit to push
}

function addBoard() {
  captureBoard(activeBoardId);
  Sync.markDirty(activeBoardId);
  const b = defaultBoard(`Board ${boards.length + 1}`);
  boards.push(b);
  activeBoardId = b.id;
  restoreBoard(b);
  renderTabs();
  saveToStorage();
}

function deleteBoard(id) {
  if (boards.length === 1) { alert("You need at least one board."); return; }
  if (!confirm(`Delete "${boards.find(b=>b.id===id)?.name}"? This cannot be undone.`)) return;
  const idx = boards.findIndex(b => b.id === id);
  boards.splice(idx, 1);
  if (activeBoardId === id) {
    activeBoardId = boards[Math.max(0, idx - 1)].id;
    restoreBoard(boards.find(b => b.id === activeBoardId));
  }
  renderTabs();
  Sync.markDeleted(id);
  Sync.markAllDirty(); // every later board's sort_order shifted
  saveToStorage();
}

function duplicateBoard() {
  captureBoard(activeBoardId);
  const src = boards.find(b => b.id === activeBoardId);
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.name = src.name + ' copy';
  const idx = boards.findIndex(b => b.id === activeBoardId);
  boards.splice(idx + 1, 0, copy);
  activeBoardId = copy.id;
  restoreBoard(copy);
  renderTabs();
  Sync.markAllDirty(); // insertion shifts every later board's sort_order
  saveToStorage();
}

let modalCallback = null;

// Export current board as PDF
document.getElementById('export-pdf-btn').addEventListener('click', async () => {
  if (!nodes.length) { alert('No items on this board to export.'); return; }
  if (!window.html2canvas || !window.jspdf) { alert('PDF libraries not loaded yet. Please try again in a moment.'); return; }

  captureBoard(activeBoardId);
  const b = boards.find(b => b.id === activeBoardId);
  const btn = document.getElementById('export-pdf-btn');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  const padding = 60;
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  nodes.forEach(n => {
    const x = n.offsetLeft, y = n.offsetTop, w = n.offsetWidth, h = n.offsetHeight;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  });

  const cropX = Math.max(0, minX - padding);
  const cropY = Math.max(0, minY - padding);
  const cropW = maxX - minX + padding * 2;
  const cropH = maxY - minY + padding * 2;

  try {
    const cvs = await html2canvas(world, {
      useCORS: true,
      scale: 2,
      backgroundColor: canvas.style.background || '#141414',
      x: cropX,
      y: cropY,
      width: cropW,
      height: cropH,
      logging: false
    });

    const { jsPDF } = window.jspdf;
    const orientation = cropW >= cropH ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit: 'pt', format: [cropW, cropH] });
    pdf.addImage(cvs.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, cropW, cropH);
    pdf.save((b?.name || 'board').replace(/\s+/g, '-') + '.pdf');
  } catch(err) {
    console.error('PDF export failed:', err);
    alert('PDF export failed. Please try again.');
  } finally {
    btn.textContent = 'Export PDF';
    btn.disabled = false;
  }
});

// Import — handles single board JSON or workspace JSON
document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-input').click());
document.getElementById('import-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    let added = [];
    try {
      const data = JSON.parse(ev.target.result);
      // Workspace file: { version, boards: [...] }
      if (data.version && Array.isArray(data.boards) && data.boards.length) {
        captureBoard(activeBoardId);
        data.boards.forEach(b => {
          const copy = JSON.parse(JSON.stringify(b));
          copy.id = uid();
          boards.push(copy);
          added.push(copy);
        });
      // Single board file: { id, name, items, ... }
      } else if (data.items && data.name) {
        data.id = uid(); data.name = data.name + ' (imported)';
        captureBoard(activeBoardId);
        boards.push(data);
        added.push(data);
      } else {
        alert('Invalid file. Expected a board or workspace JSON.');
        return;
      }
    } catch(err) { alert('Could not parse file.'); return; }

    activeBoardId = added[added.length - 1].id;
    restoreBoard(boards.find(b => b.id === activeBoardId));
    renderTabs(); saveToStorage();

    // Imported files carry base64 images; hand them to Storage so the other
    // people in the workspace load URLs instead of megabytes of JSON.
    if (Remote.enabled) {
      Sync.setBusy('Uploading images');
      for (const b of added) await absorbDataUrls(b);
      restoreBoard(boards.find(b => b.id === activeBoardId));
      added.forEach(b => Sync.markDirty(b.id));
      saveLocalCache();
      Sync.clearBusy();
      await Sync.flushNow();
    }
  };
  reader.readAsText(f);
  e.target.value = '';
});

document.getElementById('add-board-btn').addEventListener('click', addBoard);
document.getElementById('duplicate-board-btn').addEventListener('click', duplicateBoard);

// CANVAS ENGINE

const canvas = document.getElementById('canvas');
const world = document.getElementById('world');
const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const textBtn = document.getElementById('text-btn');
const clearBtn = document.getElementById('clear-btn');
const dropHint = document.getElementById('drop-hint');
const countEl = document.getElementById('count');
const aspectBtn = document.getElementById('aspect-btn');
const labelsBtn = document.getElementById('labels-btn');
const customBg = document.getElementById('custom-bg');

let nodes = [], selected = null, drag = null, resize = null;
let lockAspect = false, showLabels = true;
let spaceDown = false, panDrag = null;

aspectBtn.addEventListener('click', () => { lockAspect = !lockAspect; aspectBtn.classList.toggle('active', lockAspect); });
labelsBtn.classList.add('active'); canvas.classList.add('labels-on');
labelsBtn.addEventListener('click', () => {

  labelsBtn.classList.toggle('active', showLabels);

});

document.getElementById('swatches').addEventListener('click', e => {
  const sw = e.target.closest('.swatch'); if (!sw) return;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active'); canvas.style.background = sw.dataset.color;
  customBg.value = sw.dataset.color; updateDotGrid(sw.dataset.color);
  if (activeBoardId) { boards.find(b=>b.id===activeBoardId).bg = sw.dataset.color; saveToStorage(); }
});
customBg.addEventListener('input', () => {
  canvas.style.background = customBg.value;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  updateDotGrid(customBg.value);
  if (activeBoardId) { boards.find(b=>b.id===activeBoardId).bg = customBg.value; saveToStorage(); }
});

function updateDotGrid(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const light=(r*299+g*587+b*114)/1000>128;
  world.querySelector('.dot-grid').style.backgroundImage = light
    ? 'radial-gradient(circle,rgba(0,0,0,0.12) 1px,transparent 1px)'
    : 'radial-gradient(circle,rgba(255,255,255,0.1) 1px,transparent 1px)';
}

function updateCount() {
  const imgs = nodes.filter(n=>n.classList.contains('img-node')).length;
  const txts = nodes.filter(n=>n.classList.contains('text-node')).length;
  const parts = [];
  if (imgs) parts.push(`${imgs} image${imgs>1?'s':''}`);
  if (txts) parts.push(`${txts} text${txts>1?' boxes':' box'}`);
  countEl.textContent = parts.join(' · ');
  dropHint.style.opacity = nodes.length===0 ? '1' : '0';
}

function selectNode(el) {
  if (selected && selected !== el) selected.classList.remove('selected');
  selected = el; el.classList.add('selected'); el.style.zIndex = Date.now();
}

// Deselect on canvas/world background click
canvas.addEventListener('mousedown', e => {
  const t = e.target;
  // Middle-click or space+drag: start panning
  if (e.button === 1 || (spaceDown && e.button === 0)) {
    e.preventDefault();
    panDrag = { startX: e.clientX + canvas.scrollLeft, startY: e.clientY + canvas.scrollTop };
    canvas.classList.add('panning');
    return;
  }
  if (!t.closest('.canvas-node')) {
    if (selected) { selected.classList.remove('selected'); selected = null; }
  }
});

// Space key for pan mode
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.isContentEditable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    spaceDown = true;
    canvas.classList.add('pan-ready');
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    canvas.classList.remove('pan-ready');
  }
});

function attachDragResize(el, isText) {
  ['tl','tr','bl','br'].forEach(cls => {
    el.querySelector('.resize-handle.'+cls).addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault(); selectNode(el);
      const sr = el.querySelector('.size-readout');
      resize = { el, cls, startX:e.clientX, startY:e.clientY, startW:el.offsetWidth, startH:el.offsetHeight, startL:el.offsetLeft, startT:el.offsetTop, ar:el._ar||null, sizeReadout:sr, isText };
    });
  });
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('resize-handle')) return;
    if (e.target.closest('.action-bar,.text-format-bar')) return;
    if (e.target.classList.contains('text-content') || e.target.closest('.text-content')) return;
    e.preventDefault(); selectNode(el);
    const r = canvas.getBoundingClientRect();
    drag = { el, offX: e.clientX - r.left + canvas.scrollLeft - el.offsetLeft, offY: e.clientY - r.top + canvas.scrollTop - el.offsetTop };
  });
}

window.addEventListener('mousemove', e => {
  if (panDrag) {
    canvas.scrollLeft = panDrag.startX - e.clientX;
    canvas.scrollTop = panDrag.startY - e.clientY;
    return;
  }
  if (drag) {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left + canvas.scrollLeft - drag.offX;
    const y = e.clientY - r.top + canvas.scrollTop - drag.offY;
    drag.el.style.left = Math.max(0, x) + 'px';
    drag.el.style.top  = Math.max(0, y) + 'px';
  }
  if (resize) {
    const {el,cls,startX,startY,startW,startH,startL,startT,ar,sizeReadout,isText}=resize;
    const dx=e.clientX-startX, dy=e.clientY-startY, minW=80, minH=isText?36:60;
    let w=startW,h=startH,l=startL,t=startT;
    const useAr=lockAspect&&ar&&!isText;
    if      (cls==='br'){w=Math.max(minW,startW+dx);h=useAr?w*ar:Math.max(minH,startH+dy);}
    else if (cls==='bl'){w=Math.max(minW,startW-dx);h=useAr?w*ar:Math.max(minH,startH+dy);l=startL+(startW-w);}
    else if (cls==='tr'){w=Math.max(minW,startW+dx);h=useAr?w*ar:Math.max(minH,startH-dy);t=startT+(startH-h);}
    else if (cls==='tl'){w=Math.max(minW,startW-dx);h=useAr?w*ar:Math.max(minH,startH-dy);l=startL+(startW-w);t=startT+(startH-h);}
    el.style.width=w+'px'; el.style.left=l+'px'; el.style.top=t+'px';
    if(!isText) el.style.height=h+'px';
    if(sizeReadout) sizeReadout.textContent=`${Math.round(w)} × ${Math.round(el.offsetHeight)}`;
  }
});
window.addEventListener('mouseup', () => {
  if (panDrag) { panDrag = null; canvas.classList.remove('panning'); }
  drag=null; resize=null;
  if (activeBoardId) { captureBoard(activeBoardId); saveToStorage(); }
});

// Prevent default middle-click scroll behavior
canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') return; // handled above
  if ((e.key==='Delete'||e.key==='Backspace') && selected) {
    const a=document.activeElement;
    if (a&&(a.isContentEditable||a.tagName==='INPUT'||a.tagName==='SELECT')) return;
    world.removeChild(selected); nodes=nodes.filter(n=>n!==selected); selected=null; updateCount();
    if (activeBoardId) { captureBoard(activeBoardId); saveToStorage(); }
  }
});

// ── IMAGE NODE ────────────────────────────
function makeImageNode(src, filename, opts={}) {
  const W=opts.w||240, H=opts.h||180, margin=50;
  const x = opts.x !== undefined ? opts.x : canvas.scrollLeft + margin + Math.random()*Math.max(0, canvas.clientWidth-W-margin*2);
  const y = opts.y !== undefined ? opts.y : canvas.scrollTop  + margin + Math.random()*Math.max(0, canvas.clientHeight-H-margin*2);
  const el = document.createElement('div');
  el.className='canvas-node img-node';
  el.style.cssText=`left:${x}px;top:${y}px;width:${W}px;height:${H}px;`;
  el._ar=H/W;
  const label=opts.label!==undefined?opts.label:(filename?filename.replace(/\.[^.]+$/,''):'image');
  el.innerHTML=`
    <div class="action-bar">
      <span class="size-readout">${Math.round(W)} × ${Math.round(H)}</span>
      <div class="sep"></div><button class="flip-btn">flip</button>
      <div class="sep"></div><button class="del-btn">remove</button>
    </div>
    <div class="img-inner">
      <div class="img-frame"><img draggable="false"></div>
      <div class="resize-handle tl"></div><div class="resize-handle tr"></div>
      <div class="resize-handle bl"></div><div class="resize-handle br"></div>
    </div>
    <div class="img-label" contenteditable="false" spellcheck="false"></div>`;
  el.querySelector('.img-label').textContent = label;
  const img=el.querySelector('img');
  img.addEventListener('load',()=>{el._ar=img.naturalHeight/img.naturalWidth;});
  // Boards now arrive from a shared server, so src and label are set as
  // properties rather than interpolated into innerHTML.
  // Storage-hosted images opt into CORS so html2canvas can read them on PDF export.
  if (Remote.publicPrefix && String(src).startsWith(Remote.publicPrefix)) img.crossOrigin='anonymous';
  img.addEventListener('error',()=>{
    if (img.crossOrigin) { img.removeAttribute('crossorigin'); img.src=src+(src.includes('?')?'&':'?')+'nocors=1'; }
  },{once:true});
  img.src=src;
  if(opts.flipped) el.querySelector('.img-frame').style.transform='scaleX(-1)';
  const labelEl=el.querySelector('.img-label');
  labelEl.addEventListener('dblclick',e=>{e.stopPropagation();labelEl.contentEditable='true';labelEl.focus();const r=document.createRange();r.selectNodeContents(labelEl);window.getSelection().removeAllRanges();window.getSelection().addRange(r);});
  labelEl.addEventListener('blur',()=>{labelEl.contentEditable='false';});
  labelEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();labelEl.blur();}});
  labelEl.addEventListener('mousedown',e=>{if(labelEl.contentEditable==='true')e.stopPropagation();});
  el.querySelector('.del-btn').addEventListener('mousedown',e=>{e.stopPropagation();world.removeChild(el);nodes=nodes.filter(n=>n!==el);if(selected===el)selected=null;updateCount();captureBoard(activeBoardId);saveToStorage();});
  let flipped=opts.flipped||false;
  el.querySelector('.flip-btn').addEventListener('mousedown',e=>{e.stopPropagation();flipped=!flipped;el.querySelector('.img-frame').style.transform=flipped?'scaleX(-1)':'';});
  attachDragResize(el,false);
  world.appendChild(el);nodes.push(el);
  if(!opts.silent) selectNode(el);
  updateCount();
  return el;
}

function restoreImageNode(item) {
  makeImageNode(item.src, null, { x:item.x, y:item.y, w:item.w, h:item.h, label:item.label, flipped:item.flipped, silent:true });
  if (item.z) nodes[nodes.length-1].style.zIndex = item.z;
}

// ── TEXT NODE ─────────────────────────────
function makeTextNode(opts={}) {
  const W=opts.w||220, margin=60;
  const x=opts.x!==undefined?opts.x:canvas.scrollLeft + margin+Math.random()*Math.max(0,canvas.clientWidth-W-margin*2);
  const y=opts.y!==undefined?opts.y:canvas.scrollTop  + margin+Math.random()*Math.max(0,canvas.clientHeight-120-margin*2);
  const el=document.createElement('div');
  el.className='canvas-node text-node';
  el.style.cssText=`left:${x}px;top:${y}px;width:${W}px;`;
  el.innerHTML=`
    <div class="text-format-bar">
      <select class="font-family-sel">
        <option value="'DM Sans',sans-serif">Sans</option>
        <option value="'DM Mono',monospace">Mono</option>
        <option value="Georgia,serif">Serif</option>
      </select>
      <select class="font-size-sel">
        <option value="12">12</option><option value="14">14</option>
        <option value="16" selected>16</option><option value="20">20</option>
        <option value="24">24</option><option value="32">32</option>
        <option value="48">48</option><option value="64">64</option>
      </select>
      <div class="sep"></div>
      <button class="fmt-btn bold-btn"><b>B</b></button>
      <button class="fmt-btn italic-btn"><i>I</i></button>
      <div class="sep"></div>
      <input type="color" class="custom-color text-color-inp" value="#e8e8e8">
      <input type="color" class="custom-color bg-color-inp" value="#222222">
      <button class="fmt-btn bg-toggle-btn">bg</button>
      <div class="sep"></div>
      <button class="del-btn">remove</button>
    </div>
    <div class="text-border">
      <div class="text-content" contenteditable="true" spellcheck="true" data-placeholder="Type here…"></div>
      <div class="resize-handle tl"></div><div class="resize-handle tr"></div>
      <div class="resize-handle bl"></div><div class="resize-handle br"></div>
    </div>`;
  const content=el.querySelector('.text-content');
  const textBorder=el.querySelector('.text-border');
  const fontFamilySel=el.querySelector('.font-family-sel');
  const fontSizeSel=el.querySelector('.font-size-sel');
  const boldBtn=el.querySelector('.bold-btn');
  const italicBtn=el.querySelector('.italic-btn');
  const textColorInp=el.querySelector('.text-color-inp');
  const bgColorInp=el.querySelector('.bg-color-inp');
  const bgToggleBtn=el.querySelector('.bg-toggle-btn');

  if(opts.html) content.innerHTML=sanitizeRichText(opts.html);
  if(opts.fontSize){content.style.fontSize=opts.fontSize;const o=opts.fontSize.replace('px','');const opt=[...fontSizeSel.options].find(o2=>o2.value===o);if(opt)opt.selected=true;}
  if(opts.fontFamily){content.style.fontFamily=opts.fontFamily;const opt=[...fontFamilySel.options].find(o=>o.value===opts.fontFamily);if(opt)opt.selected=true;}
  if(opts.fontWeight){content.style.fontWeight=opts.fontWeight;}
  if(opts.fontStyle){content.style.fontStyle=opts.fontStyle;}
  if(opts.color){content.style.color=opts.color;textColorInp.value=opts.color;}
  if(opts.bgColor&&opts.bgColor!=='transparent'){textBorder.style.background=opts.bgColor;bgColorInp.value=opts.bgColor;bgToggleBtn.classList.add('active');}

  let isBold=opts.fontWeight==='700', isItalic=opts.fontStyle==='italic', bgOn=opts.bgColor&&opts.bgColor!=='transparent';
  if(isBold) boldBtn.classList.add('active');
  if(isItalic) italicBtn.classList.add('active');

  fontFamilySel.addEventListener('change',()=>{content.style.fontFamily=fontFamilySel.value;});
  fontFamilySel.addEventListener('mousedown',e=>e.stopPropagation());
  fontSizeSel.addEventListener('change',()=>{content.style.fontSize=fontSizeSel.value+'px';});
  fontSizeSel.addEventListener('mousedown',e=>e.stopPropagation());
  boldBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();isBold=!isBold;content.style.fontWeight=isBold?'700':'400';boldBtn.classList.toggle('active',isBold);});
  italicBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();isItalic=!isItalic;content.style.fontStyle=isItalic?'italic':'normal';italicBtn.classList.toggle('active',isItalic);});
  textColorInp.addEventListener('input',()=>{content.style.color=textColorInp.value;});
  textColorInp.addEventListener('mousedown',e=>e.stopPropagation());
  bgColorInp.addEventListener('input',()=>{if(bgOn)textBorder.style.background=bgColorInp.value;});
  bgColorInp.addEventListener('mousedown',e=>e.stopPropagation());
  bgToggleBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();bgOn=!bgOn;textBorder.style.background=bgOn?bgColorInp.value:'transparent';bgToggleBtn.classList.toggle('active',bgOn);});
  content.addEventListener('mousedown',e=>{e.stopPropagation();selectNode(el);});
  content.addEventListener('focus',()=>selectNode(el));
  el.querySelector('.del-btn').addEventListener('mousedown',e=>{e.stopPropagation();world.removeChild(el);nodes=nodes.filter(n=>n!==el);if(selected===el)selected=null;updateCount();captureBoard(activeBoardId);saveToStorage();});
  attachDragResize(el,true);
  world.appendChild(el);nodes.push(el);
  if(!opts.silent){selectNode(el);setTimeout(()=>content.focus(),50);}
  updateCount();
}

// Text nodes are rich text, so their HTML is kept. It now comes from a shared
// server, so strip anything that could execute before it goes into the DOM.
function sanitizeRichText(html) {
  const tpl = document.createElement('template'); // inert: nothing runs or loads
  tpl.innerHTML = String(html || '');
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(n => n.remove());
  tpl.content.querySelectorAll('*').forEach(node => {
    [...node.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) node.removeAttribute(attr.name);
      else if (/^(href|src|xlink:href|action|formaction)$/.test(name) && /^\s*javascript:/i.test(attr.value)) node.removeAttribute(attr.name);
    });
  });
  return tpl.innerHTML;
}

function restoreTextNode(item) {
  makeTextNode({ x:item.x, y:item.y, w:item.w, html:item.html,
    fontSize:item.fontSize, fontFamily:item.fontFamily, fontWeight:item.fontWeight,
    fontStyle:item.fontStyle, color:item.color, bgColor:item.bgColor, silent:true });
  if (item.z) nodes[nodes.length-1].style.zIndex = item.z;
}

// ── FILE LOADING ──────────────────────────
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadFiles(files) {
  const images = [...files].filter(f => f.type.startsWith('image/'));
  if (!images.length) return;

  // Local mode keeps the old behaviour: base64 straight into the board.
  if (!Remote.enabled) {
    for (const f of images) {
      makeImageNode(await fileToDataUrl(f), f.name);
      captureBoard(activeBoardId); saveToStorage();
    }
    return;
  }

  // Shared mode uploads to Storage so the board only carries a URL and the
  // other people in the workspace can actually load the image.
  let failed = 0;
  Sync.setBusy('Uploading ' + images.length + (images.length > 1 ? ' images' : ' image'));
  for (const f of images) {
    try {
      makeImageNode(await Remote.uploadImage(f, f.name), f.name);
    } catch (err) {
      console.warn('Image upload failed; keeping it inline in this board', err);
      failed++;
      makeImageNode(await fileToDataUrl(f), f.name);
    }
    captureBoard(activeBoardId); saveToStorage();
  }
  Sync.clearBusy();
  if (failed) {
    alert(failed + ' image(s) could not be uploaded to shared storage and were embedded in this board instead.\n\nCheck the board-images bucket and its policies in Supabase.');
  }
}

uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{loadFiles(fileInput.files);fileInput.value='';});
textBtn.addEventListener('click',()=>{makeTextNode();captureBoard(activeBoardId);saveToStorage();});

clearBtn.addEventListener('click',()=>{
  if(!nodes.length) return;
  if(confirm(`Clear all items on "${boards.find(b=>b.id===activeBoardId)?.name}"?`)){
    nodes.forEach(n=>world.removeChild(n));nodes=[];selected=null;updateCount();
    captureBoard(activeBoardId);saveToStorage();
  }
});

canvas.addEventListener('dragenter',e=>{e.preventDefault();canvas.classList.add('drag-over');});
canvas.addEventListener('dragover',e=>e.preventDefault());
canvas.addEventListener('dragleave',e=>{if(!canvas.contains(e.relatedTarget))canvas.classList.remove('drag-over');});
canvas.addEventListener('drop',e=>{e.preventDefault();canvas.classList.remove('drag-over');loadFiles(e.dataTransfer.files);});

// ════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════
// Existing single-browser boards get lifted into an empty shared workspace the
// first time someone connects one, so nothing has to be re-made by hand.
async function uploadLocalBoards() {
  const local = readBoardsFrom(STORAGE_KEY);
  if (!local || !local.some(b => (b.items || []).length)) return false;
  Sync.setBusy('Uploading ' + local.length + (local.length > 1 ? ' local boards' : ' local board'));
  const moved = [];
  for (const b of local) moved.push(await absorbDataUrls(JSON.parse(JSON.stringify(b))));
  boards = moved;
  Sync.clearBusy();
  return true;
}

async function reloadSharedWorkspace(preferId) {
  const remote = await Sync.pull();
  if (!remote) return false;
  boards = remote.length ? remote : [defaultBoard('Board 1')];
  showBoards(preferId === undefined ? activeBoardId : preferId);
  saveLocalCache();
  if (!remote.length) { Sync.markAllDirty(); }
  return true;
}

function showBoards(preferId) {
  activeBoardId = boards.some(b => b.id === preferId) ? preferId : boards[0].id;
  restoreBoard(boards.find(b => b.id === activeBoardId));
  renderTabs();
}

async function boot() {
  // Paint the cached copy first so the canvas is usable before the network answers.
  loadFromStorage();
  showBoards(null);
  Sync.render();

  if (!Remote.enabled) { document.getElementById('sync-btn').hidden = true; return; }

  const remote = await Sync.pull();
  if (!remote) return; // offline: the cached copy stays on screen and the badge says so

  if (remote.length) {
    boards = remote;
    showBoards(null);
    saveLocalCache();
    return;
  }

  // Nothing in the shared workspace yet.
  if (!await uploadLocalBoards()) boards = [defaultBoard('Board 1')];
  showBoards(null);
  saveLocalCache();
  Sync.markAllDirty();
  await Sync.flushNow();
}

document.getElementById('sync-btn').addEventListener('click', async () => {
  const btn = document.getElementById('sync-btn');
  btn.disabled = true;
  try {
    await Sync.flushNow();  // push what is pending before pulling
    // stay on the board you were looking at
    if (!await reloadSharedWorkspace(activeBoardId)) {
      alert('Could not reach the shared workspace.\n\nYour changes are still saved in this browser and will be retried.');
      return;
    }
    await Sync.flushNow();
  } finally { btn.disabled = false; }
});

// Clicking the badge while it is red retries immediately.
document.getElementById('sync-status').addEventListener('click', () => {
  if (document.getElementById('sync-status').classList.contains('bad')) Sync.flushNow();
});

// Best effort: get pending edits out before the tab goes away or is hidden.
document.addEventListener('visibilitychange', () => { if (document.hidden) Sync.flushNow(); });
window.addEventListener('beforeunload', e => {
  if (!Sync.hasPending()) return;
  Sync.flushNow();
  e.preventDefault();
  e.returnValue = '';
});

boot();
</script>
