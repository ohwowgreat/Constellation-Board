<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Board</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Live rooms (class collaboration). Config lives in firebase-config.js -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
  --border: rgba(255,255,255,0.1); --border-hover: rgba(255,255,255,0.2);
  --text: #e8e8e8; --text-muted: #888;
  --accent: #FF4D00; --accent-dim: rgba(255,77,0,0.15);
  --canvas-bg: #141414; --handle: #FF4D00;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── BOARD BAR ── */
#board-bar {
  display: flex; align-items: center; gap: 0;
  background: #111; border-bottom: 1px solid var(--border);
  padding: 0 12px; flex-shrink: 0; overflow-x: auto; min-height: 38px;
}
#board-bar::-webkit-scrollbar { height: 3px; }
#board-bar::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }
.board-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 38px; cursor: pointer;
  font-size: 12px; color: var(--text-muted);
  border-right: 1px solid var(--border);
  white-space: nowrap; flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
  position: relative;
}
.board-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.board-tab.active { color: var(--text); background: var(--surface); }
.board-tab.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--accent);
}
.board-tab-name { outline: none; background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; max-width: 120px; }
.board-tab-name:focus { color: var(--text); border-bottom: 1px solid var(--accent); cursor: text; }
.board-tab .close-tab {
  font-size: 14px; color: var(--text-muted); line-height: 1;
  padding: 0 2px; border: none; background: transparent; cursor: pointer;
  opacity: 0; transition: opacity 0.15s, color 0.15s;
}
.board-tab:hover .close-tab, .board-tab.active .close-tab { opacity: 1; }
.board-tab .close-tab:hover { color: #ff6060; }
#add-board-btn {
  padding: 0 12px; height: 38px; font-size: 18px; line-height: 1;
  color: var(--text-muted); border: none; background: transparent;
  cursor: pointer; flex-shrink: 0; transition: color 0.15s;
}
#add-board-btn:hover { color: var(--accent); }
.board-actions {
  margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; padding-left: 12px;
}
.board-actions button {
  font-family: var(--sans); font-size: 11px; padding: 4px 10px;
  border-radius: 5px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.board-actions button:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.05); }

/* ── TOOLBAR ── */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.tool-group { display: flex; align-items: center; gap: 6px; padding-right: 12px; border-right: 1px solid var(--border); margin-right: 6px; }
.tool-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
.app-title { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 8px; }

button { font-family: var(--sans); font-size: 12px; font-weight: 400; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s; white-space: nowrap; }
button:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.05); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
button.primary:hover { background: #e04400; border-color: #e04400; }
button.secondary { border-color: rgba(255,255,255,0.22); }
button.danger:hover { border-color: rgba(255,80,80,0.5); color: #ff6060; }

.toggle-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 10px; }
.toggle-btn .icon { width: 14px; height: 14px; border: 1.5px solid var(--text-muted); border-radius: 3px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, background 0.15s; }
.toggle-btn.active .icon { background: var(--accent); border-color: var(--accent); }
.toggle-btn.active .icon::after { content: ''; display: block; width: 7px; height: 4px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translateY(-1px); }

#count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-left: auto; }
.color-picker-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.swatch-row { display: flex; gap: 4px; }
.swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
.swatch:hover { transform: scale(1.15); border-color: var(--border-hover); }
.swatch.active { border-color: var(--accent); transform: scale(1.15); }
.custom-color { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); padding: 0; cursor: pointer; overflow: hidden; }

/* ── CANVAS & WORLD ── */
#canvas {
  flex: 1; position: relative; overflow: auto;
  background: var(--canvas-bg); transition: background 0.3s;
}
#canvas::-webkit-scrollbar { width: 8px; height: 8px; }
#canvas::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
#canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
#canvas::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
#canvas::-webkit-scrollbar-corner { background: rgba(0,0,0,0.2); }
#canvas.pan-ready { cursor: grab; }
#canvas.panning { cursor: grabbing; }

#zoom-box { position: relative; width: 4000px; height: 3000px; flex-shrink: 0; }
#world {
  position: absolute; top: 0; left: 0;
  width: 4000px;
  height: 3000px;
  transform-origin: 0 0;
}
.zoom-group { gap: 2px; }
.zoom-group button { padding: 6px 9px; }
#zoom-readout { font-family: var(--mono); font-size: 11px; min-width: 46px; text-align: center; color: var(--text-muted); }
#zoom-readout:hover { color: var(--text); }

.dot-grid { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }
#drop-hint { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; transition: opacity 0.3s; z-index: 5; }
#drop-hint .hint-icon { width: 56px; height: 56px; border: 1.5px dashed rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
#drop-hint p { font-size: 13px; color: rgba(255,255,255,0.25); font-family: var(--mono); }
#drop-hover-overlay { display: none; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-dim); pointer-events: none; z-index: 1000; }
#canvas.drag-over #drop-hover-overlay { display: block; }

/* pan hint */
#pan-hint {
  position: absolute; bottom: 12px; right: 16px;
  font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.2);
  pointer-events: none; z-index: 5; user-select: none;
}

/* ── NODES ── */
.canvas-node { position: absolute; user-select: none; cursor: grab; }
.canvas-node:active { cursor: grabbing; }
.resize-handle { position: absolute; width: 10px; height: 10px; background: var(--bg); border: 1.5px solid var(--handle); border-radius: 2px; z-index: 10; display: none; }
.canvas-node.selected .resize-handle { display: block; }
.resize-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
.resize-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
.resize-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
.resize-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

.action-bar { position: absolute; top: -36px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; white-space: nowrap; z-index: 20; }
.canvas-node.selected .action-bar { display: flex; }
.action-bar button { font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.action-bar .sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }
.action-bar .size-readout { font-family: var(--mono); font-size: 10px; color: var(--text-muted); padding: 3px 6px; pointer-events: none; }

.img-node .img-inner { width: 100%; height: 100%; position: relative; }
.img-frame { width: 100%; height: 100%; overflow: hidden; border-radius: 6px; border: 1.5px solid transparent; transition: border-color 0.15s; }
.img-node.selected .img-frame { border-color: var(--accent); }
.img-frame img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.img-label { position: absolute; bottom: -26px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; transition: color 0.15s; display: none; }
.img-node.selected .img-label { color: var(--text); }
.labels-on .img-label { display: block; }
/* light backgrounds: dark captions and hints so they stay readable */
#canvas.light-bg .img-label { color: #6a6a6a; }
#canvas.light-bg .img-node.selected .img-label { color: #111; }
#canvas.light-bg #drop-hint p { color: rgba(0,0,0,0.35); }
#canvas.light-bg #drop-hint .hint-icon { border-color: rgba(0,0,0,0.2); }
#canvas.light-bg #drop-hint svg { stroke: rgba(0,0,0,0.3); }
#canvas.light-bg #pan-hint { color: rgba(0,0,0,0.3); }
#canvas.light-bg .text-content:empty::before { color: rgba(0,0,0,0.3); }

.text-node { min-width: 100px; }
.text-border { width: 100%; min-height: 40px; border: 1.5px solid transparent; border-radius: 6px; transition: border-color 0.15s; position: relative; }
.text-node.selected .text-border { border-color: var(--accent); }
.text-content { width: 100%; min-height: 36px; padding: 8px 10px; outline: none; font-family: var(--sans); font-size: 16px; font-weight: 400; color: #e8e8e8; line-height: 1.5; word-break: break-word; white-space: pre-wrap; cursor: text; background: transparent; border: none; display: block; box-sizing: border-box; }
.text-content:empty::before { content: attr(data-placeholder); color: rgba(255,255,255,0.2); pointer-events: none; }
.text-format-bar { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; white-space: nowrap; z-index: 21; }
.text-node.selected .text-format-bar { display: flex; }
.text-format-bar button { font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.text-format-bar .sep { width: 1px; height: 14px; background: var(--border); margin: 0 3px; }
.text-format-bar select { font-family: var(--sans); font-size: 11px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 5px; cursor: pointer; }
.text-format-bar select option { background: #1a1a1a; }
.fmt-btn { font-weight: 600; min-width: 26px; text-align: center; }
.fmt-btn.active { background: rgba(255,77,0,0.2) !important; border-color: var(--accent) !important; color: var(--accent) !important; }

/* ── MODAL ── */
#modal-overlay, #share-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
#modal-overlay.open, #share-overlay.open { display: flex; }
#modal, #share-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; width: 340px; }
#modal h3, #share-modal h3 { font-size: 14px; font-weight: 500; margin-bottom: 14px; }
#modal input[type="text"], #share-modal input[type="text"] { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; margin-bottom: 16px; }
#modal input[type="text"]:focus, #share-modal input[type="text"]:focus { border-color: var(--accent); }
#modal .modal-btns, #share-modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
#modal .modal-btns button, #share-modal .modal-btns button { font-size: 12px; padding: 6px 16px; }

#file-input { display: none; }
#import-input { display: none; }

/* ── LIVE ROOMS / SHARE ── */
.board-actions button#share-btn { border-color: rgba(255,77,0,0.5); color: var(--accent); }
.board-actions button#share-btn:hover { background: var(--accent-dim); color: var(--accent); }
.board-actions button#share-btn.live { background: var(--accent); border-color: var(--accent); color: #fff; }
#live-bar {
  display: none; align-items: center; gap: 12px; padding: 5px 16px;
  background: #1c0e06; border-bottom: 1px solid rgba(255,77,0,0.35);
  font-size: 12px; color: var(--text-muted); flex-shrink: 0; min-height: 32px;
}
#live-bar.on { display: flex; }
#live-bar .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: livepulse 1.6s infinite; flex-shrink: 0; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,0,0.6); } 70% { box-shadow: 0 0 0 7px rgba(255,77,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,0,0); } }
#live-bar .live-code { font-family: var(--mono); font-size: 13px; color: var(--text); letter-spacing: 0.14em; }
#live-bar .live-link { font-family: var(--mono); font-size: 11px; color: var(--text-muted); max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#live-bar button { font-size: 11px; padding: 3px 9px; }
#live-bar .live-status { margin-left: auto; font-family: var(--mono); font-size: 11px; }
#live-bar .live-status.offline { color: #ff6060; }
#share-modal { width: 440px; }
#share-modal p { font-size: 12px; color: var(--text-muted); line-height: 1.55; margin-bottom: 12px; }
#share-modal .share-section { padding: 14px 0; border-top: 1px solid var(--border); }
#share-modal .share-section.first { border-top: none; padding-top: 0; }
#share-modal h4 { font-size: 12px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
#share-modal .row { display: flex; gap: 8px; align-items: center; }
#share-modal .row input[type="text"] { margin-bottom: 0; flex: 1; font-family: var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
#share-modal .big-code { font-family: var(--mono); font-size: 42px; letter-spacing: 0.22em; color: var(--accent); text-align: center; padding: 6px 0 2px; user-select: all; }
#share-modal .share-link { font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; word-break: break-all; user-select: all; margin: 10px 0; }
#share-modal .share-error { color: #ff6060; font-size: 12px; min-height: 16px; margin-top: 8px; }
#share-modal ol { font-size: 12px; color: var(--text-muted); line-height: 1.6; padding-left: 18px; margin-bottom: 12px; }
#share-modal code { font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
#share-modal .recent { display: flex; flex-wrap: wrap; gap: 6px; }
#share-modal .recent button { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; }
#share-modal a { color: var(--accent); }
</style>
</head>
<body>

<!-- BOARD TABS -->
<div id="board-bar">
  <div id="tabs-container"></div>
  <button id="add-board-btn" title="New board">+</button>
  <div class="board-actions">
    <button id="share-btn" title="Share this board live with a class">Share</button>
    <button id="duplicate-board-btn">Duplicate</button>
    <button id="export-board-btn">Export JSON</button>
    <button id="export-pdf-btn">Export PDF</button>
    <button id="export-workspace-btn">Export All</button>
    <button id="import-btn">Import</button>
  </div>
</div>

<!-- LIVE ROOM BAR -->
<div id="live-bar">
  <span class="live-dot"></span>
  <span>Live room</span>
  <span class="live-code" id="live-code"></span>
  <span class="live-link" id="live-link"></span>
  <button id="live-copy-btn">Copy link</button>
  <span class="live-status" id="live-status"></span>
  <button id="live-leave-btn">Leave</button>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <span class="app-title">canvas</span>
  <div class="tool-group">
    <button class="primary" id="upload-btn">+ Images</button>
    <button class="secondary" id="text-btn">T+ Text</button>
  </div>
  <div class="tool-group">
    <button class="toggle-btn" id="aspect-btn"><span class="icon"></span>Lock ratio</button>
    <button class="toggle-btn" id="labels-btn"><span class="icon"></span>Labels</button>
  </div>
  <div class="tool-group color-picker-wrap">
    <span>BG</span>
    <div class="swatch-row" id="swatches">
      <div class="swatch active" style="background:#141414" data-color="#141414"></div>
      <div class="swatch" style="background:#1a1a2e" data-color="#1a1a2e"></div>
      <div class="swatch" style="background:#0d1f0d" data-color="#0d1f0d"></div>
      <div class="swatch" style="background:#f5f0e8" data-color="#f5f0e8"></div>
      <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
      <div class="swatch" style="background:#1a0a00" data-color="#1a0a00"></div>
    </div>
    <input type="color" class="custom-color" id="custom-bg" value="#141414">
  </div>
  <div class="tool-group zoom-group">
    <button id="zoom-out-btn" title="Zoom out (ctrl + minus)">−</button>
    <button id="zoom-readout" title="Reset to 100% (ctrl + 0)">100%</button>
    <button id="zoom-in-btn" title="Zoom in (ctrl + plus)">+</button>
    <button id="zoom-fit-btn" title="Fit everything on screen (ctrl + 1)">Fit</button>
  </div>
  <div class="tool-group">
    <button class="danger" id="clear-btn">Clear board</button>
  </div>
  <span id="count"></span>
</div>

<div id="canvas">
  <div id="zoom-box">
    <div id="world">
      <div class="dot-grid"></div>
    </div>
  </div>
  <div id="drop-hover-overlay"></div>
  <div id="drop-hint">
    <div class="hint-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="8.5" cy="10.5" r="1.5"/>
        <path d="M3 16l5-5 4 4 3-3 6 5"/>
      </svg>
    </div>
    <p>drop images · click + images or T+ text to begin</p>
  </div>
  <div id="pan-hint">middle-click or space+drag to pan · ctrl+scroll or pinch to zoom</div>
</div>

<input type="file" id="file-input" multiple accept="image/*">
<input type="file" id="import-input" accept=".json">

<!-- RENAME MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Rename board</h3>
    <input type="text" id="modal-input" placeholder="Board name">
    <div class="modal-btns">
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-confirm">OK</button>
    </div>
  </div>
</div>

<!-- SHARE / LIVE ROOM MODAL -->
<div id="share-overlay">
  <div id="share-modal"></div>
</div>

<script>
// ════════════════════════════════════════════════
// BOARD STATE
// ════════════════════════════════════════════════
const STORAGE_KEY = 'imagecanvas_boards_v1';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// boards = [{ id, name, bg, scrollX, scrollY, items: [...serialized] }]
let boards = [];
let activeBoardId = null;
let liveMode = false; // true while connected to a shared room (see LIVE ROOMS below)

function defaultBoard(name = 'Board 1') {
  return { id: uid(), name, bg: '#141414', scrollX: 0, scrollY: 0, items: [] };
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed) && parsed.length) { boards = parsed; return; } }
  } catch(e) {}
  boards = [defaultBoard('Board 1')];
}

function saveToStorage() {
  if (liveMode) return; // room boards live in Firebase, never overwrite the local workspace
  if (activeBoardId) captureBoard(activeBoardId);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(boards)); } catch(e) { console.warn('Storage save failed (quota?)', e); }
}

// ════════════════════════════════════════════════
// SERIALIZE / DESERIALIZE NODES
// ════════════════════════════════════════════════
function serializeNode(el) {
  const base = { id: el.dataset.id, x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight, z: parseInt(el.style.zIndex)||0 };
  if (el.classList.contains('img-node')) {
    return { ...base, type: 'image', src: el.querySelector('img').src, label: el.querySelector('.img-label').textContent, flipped: el.querySelector('.img-frame').style.transform === 'scaleX(-1)' };
  }
  if (el.classList.contains('text-node')) {
    const c = el.querySelector('.text-content');
    const tb = el.querySelector('.text-border');
    return { ...base, type: 'text', html: c.innerHTML,
      fontSize: c.style.fontSize || '16px', fontFamily: c.style.fontFamily || '',
      fontWeight: c.style.fontWeight || '400', fontStyle: c.style.fontStyle || 'normal',
      color: c.style.color || '#e8e8e8', bgColor: tb.style.background || 'transparent' };
  }
  return null;
}
function serializeNodes() { return nodes.map(serializeNode).filter(Boolean); }

function nodeById(id) { return nodes.find(n => n.dataset.id === id) || null; }

function clearNodes() {
  nodes.forEach(n => { try { world.removeChild(n); } catch(e){} });
  nodes = []; selected = null;
}

// Remove a single node from the canvas (does not notify the store)
function removeNodeEl(el) {
  try { world.removeChild(el); } catch(e) {}
  nodes = nodes.filter(n => n !== el);
  if (selected === el) selected = null;
  updateCount();
}

function restoreItem(item) {
  if (item.type === 'image') restoreImageNode(item);
  else if (item.type === 'text') restoreTextNode(item);
}

function applyBoardBg(bg) {
  bg = bg || '#141414';
  if (canvas.style.background !== bg) canvas.style.background = bg;
  const hex = /^#[0-9a-f]{6}$/i.test(bg) ? bg : '#141414';
  if (customBg.value !== hex) customBg.value = hex;
  updateDotGrid(hex);
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === bg));
}

// ── Change notifications ──
// Every edit to a node funnels through here so the local store and the live room stay in sync.
let localSaveTimer = null;
function scheduleLocalSave() { clearTimeout(localSaveTimer); localSaveTimer = setTimeout(saveToStorage, 150); }
function notifyNodeChanged(el, isNew) {
  if (liveMode) { Live.pushItem(el, isNew); return; }
  scheduleLocalSave();
}
function notifyNodeRemoved(id) {
  if (liveMode) { Live.removeItem(id); return; }
  scheduleLocalSave();
}

function captureBoard(boardId) {
  const b = boards.find(b => b.id === boardId);
  if (!b) return;
  b.items = serializeNodes();
  b.bg = canvas.style.background || '#141414';
  b.scrollX = canvas.scrollLeft;
  b.scrollY = canvas.scrollTop;
}

function restoreBoard(b) {
  clearNodes();
  applyBoardBg(b.bg);

  const items = [...(b.items || [])].sort((a,b) => a.z - b.z);
  items.forEach(restoreItem);

  requestAnimationFrame(() => {
    canvas.scrollLeft = b.scrollX || 0;
    canvas.scrollTop = b.scrollY || 0;
  });

  updateCount();
}

// ════════════════════════════════════════════════
// TABS UI
// ════════════════════════════════════════════════
function renderTabs() {
  const container = document.getElementById('tabs-container');
  container.innerHTML = '';
  boards.forEach(b => {
    const tab = document.createElement('div');
    tab.className = 'board-tab' + (b.id === activeBoardId ? ' active' : '');
    tab.dataset.id = b.id;

    const nameEl = document.createElement('span');
    nameEl.className = 'board-tab-name';
    nameEl.textContent = b.name;
    nameEl.title = 'Double-click to rename';
    nameEl.addEventListener('dblclick', e => { e.stopPropagation(); openRenameModal(b.id); });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'close-tab';
    closeBtn.textContent = '×';
    closeBtn.title = 'Delete board';
    closeBtn.addEventListener('click', e => { e.stopPropagation(); deleteBoard(b.id); });

    tab.appendChild(nameEl);
    tab.appendChild(closeBtn);
    tab.addEventListener('click', () => switchBoard(b.id));
    container.appendChild(tab);
  });
}

function switchBoard(id) {
  if (id === activeBoardId) return;
  if (liveMode) { Live.enterBoard(id); return; }
  captureBoard(activeBoardId);
  activeBoardId = id;
  const b = boards.find(b => b.id === id);
  restoreBoard(b);
  renderTabs();
  saveToStorage();
}

function addBoard() {
  if (liveMode) { Live.addBoard(); return; }
  captureBoard(activeBoardId);
  const b = defaultBoard(`Board ${boards.length + 1}`);
  boards.push(b);
  activeBoardId = b.id;
  restoreBoard(b);
  renderTabs();
  saveToStorage();
}

function deleteBoard(id) {
  if (boards.length === 1) { alert("You need at least one board."); return; }
  if (!confirm(`Delete "${boards.find(b=>b.id===id)?.name}"? This cannot be undone.`)) return;
  if (liveMode) { Live.deleteBoard(id); return; }
  const idx = boards.findIndex(b => b.id === id);
  boards.splice(idx, 1);
  if (activeBoardId === id) {
    activeBoardId = boards[Math.max(0, idx - 1)].id;
    restoreBoard(boards.find(b => b.id === activeBoardId));
  }
  renderTabs();
  saveToStorage();
}

function duplicateBoard() {
  if (liveMode) { Live.duplicateBoard(); return; }
  captureBoard(activeBoardId);
  const src = boards.find(b => b.id === activeBoardId);
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.name = src.name + ' copy';
  const idx = boards.findIndex(b => b.id === activeBoardId);
  boards.splice(idx + 1, 0, copy);
  activeBoardId = copy.id;
  restoreBoard(copy);
  renderTabs();
  saveToStorage();
}

let modalCallback = null;
function openRenameModal(boardId) {
  const b = boards.find(b => b.id === boardId);
  document.getElementById('modal-title').textContent = 'Rename board';
  const inp = document.getElementById('modal-input');
  inp.value = b.name;

}
document.getElementById('modal-cancel').addEventListener('click', () => { document.getElementById('modal-overlay').classList.remove('open'); });
document.getElementById('modal-confirm').addEventListener('click', () => {

});

// Export current board as PDF
document.getElementById('export-pdf-btn').addEventListener('click', async () => {
  if (!nodes.length) { alert('No items on this board to export.'); return; }
  if (!window.html2canvas || !window.jspdf) { alert('PDF libraries not loaded yet. Please try again in a moment.'); return; }

  captureBoard(activeBoardId);
  const b = boards.find(b => b.id === activeBoardId);
  const btn = document.getElementById('export-pdf-btn');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  const padding = 60;
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  nodes.forEach(n => {
    const x = n.offsetLeft, y = n.offsetTop, w = n.offsetWidth, h = n.offsetHeight;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  });

  const cropX = Math.max(0, minX - padding);
  const cropY = Math.max(0, minY - padding);
  const cropW = maxX - minX + padding * 2;
  const cropH = maxY - minY + padding * 2;

  const prevZoom = zoom, prevSX = canvas.scrollLeft, prevSY = canvas.scrollTop;
  world.style.transform = 'none'; // html2canvas renders the unscaled world
  try {
    const cvs = await html2canvas(world, {
      useCORS: true,
      scale: 2,
      backgroundColor: canvas.style.background || '#141414',
      x: cropX,
      y: cropY,
      width: cropW,
      height: cropH,
      logging: false
    });

    const { jsPDF } = window.jspdf;
    const orientation = cropW >= cropH ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit: 'pt', format: [cropW, cropH] });
    pdf.addImage(cvs.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, cropW, cropH);
    pdf.save((b?.name || 'board').replace(/\s+/g, '-') + '.pdf');
  } catch(err) {
    console.error('PDF export failed:', err);
    alert('PDF export failed. Please try again.');
  } finally {
    world.style.transform = `scale(${prevZoom})`;
    canvas.scrollLeft = prevSX; canvas.scrollTop = prevSY;
    btn.textContent = 'Export PDF';
    btn.disabled = false;
  }
});

// Import — handles single board JSON or workspace JSON
document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-input').click());
document.getElementById('import-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      // Workspace file: { version, boards: [...] }
      if (data.version && Array.isArray(data.boards) && data.boards.length) {
        if (liveMode) { Live.importBoards(data.boards); return; }
        captureBoard(activeBoardId);
        const added = [];
        data.boards.forEach(b => {
          const copy = JSON.parse(JSON.stringify(b));
          copy.id = uid();
          boards.push(copy);
          added.push(copy);
        });
        activeBoardId = added[added.length - 1].id;
        restoreBoard(boards.find(b => b.id === activeBoardId));
        renderTabs(); saveToStorage();
      // Single board file: { id, name, items, ... }
      } else if (data.items && data.name) {
        data.id = uid(); data.name = data.name + ' (imported)';
        if (liveMode) { Live.importBoards([data]); return; }
        captureBoard(activeBoardId);
        boards.push(data);
        activeBoardId = data.id;
        restoreBoard(data);
        renderTabs(); saveToStorage();
      } else {
        alert('Invalid file. Expected a board or workspace JSON.');
      }
    } catch(err) { alert('Could not parse file.'); }
  };
  reader.readAsText(f);
  e.target.value = '';
});

document.getElementById('add-board-btn').addEventListener('click', addBoard);
document.getElementById('duplicate-board-btn').addEventListener('click', duplicateBoard);

// ════════════════════════════════════════════════
// CANVAS ENGINE
// ════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const world = document.getElementById('world');
const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const textBtn = document.getElementById('text-btn');
const clearBtn = document.getElementById('clear-btn');
const dropHint = document.getElementById('drop-hint');
const countEl = document.getElementById('count');
const aspectBtn = document.getElementById('aspect-btn');
const labelsBtn = document.getElementById('labels-btn');
const customBg = document.getElementById('custom-bg');

let nodes = [], selected = null, drag = null, resize = null;
let lockAspect = false, showLabels = true;
let spaceDown = false, panDrag = null;

// ── ZOOM ──────────────────────────────────
// The world is scaled with a CSS transform; #zoom-box gives the scroll area the matching size.
// Zoom is per screen only (never shared in a live room). Node positions stay in world units.
const WORLD_W = 4000, WORLD_H = 3000, ZOOM_MIN = 0.25, ZOOM_MAX = 3;
let zoom = 1;
const zoomBox = document.getElementById('zoom-box');
const zoomReadout = document.getElementById('zoom-readout');

// Convert a mouse position to world coordinates
function toWorld(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left + canvas.scrollLeft) / zoom, y: (clientY - r.top + canvas.scrollTop) / zoom };
}

// Set zoom keeping the world point under (cx, cy) fixed on screen; defaults to the view centre.
function setZoom(z, cx, cy) {
  z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  const r = canvas.getBoundingClientRect();
  if (cx === undefined) { cx = r.left + canvas.clientWidth / 2; cy = r.top + canvas.clientHeight / 2; }
  const mx = cx - r.left, my = cy - r.top;
  const wx = (canvas.scrollLeft + mx) / zoom, wy = (canvas.scrollTop + my) / zoom;
  zoom = z;
  world.style.transform = `scale(${z})`;
  zoomBox.style.width = WORLD_W * z + 'px';
  zoomBox.style.height = WORLD_H * z + 'px';
  canvas.scrollLeft = wx * z - mx;
  canvas.scrollTop = wy * z - my;
  zoomReadout.textContent = Math.round(z * 100) + '%';
}

function zoomToFit() {
  if (!nodes.length) { setZoom(1); return; }
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  nodes.forEach(n => {
    minX = Math.min(minX, n.offsetLeft); minY = Math.min(minY, n.offsetTop);
    maxX = Math.max(maxX, n.offsetLeft + n.offsetWidth); maxY = Math.max(maxY, n.offsetTop + n.offsetHeight + 30);
  });
  const pad = 60;
  const z = Math.min(canvas.clientWidth / (maxX - minX + pad * 2), canvas.clientHeight / (maxY - minY + pad * 2));
  setZoom(Math.min(1.5, z));
  canvas.scrollLeft = ((minX + maxX) / 2) * zoom - canvas.clientWidth / 2;
  canvas.scrollTop = ((minY + maxY) / 2) * zoom - canvas.clientHeight / 2;
}

document.getElementById('zoom-in-btn').addEventListener('click', () => setZoom(zoom * 1.2));
document.getElementById('zoom-out-btn').addEventListener('click', () => setZoom(zoom / 1.2));
document.getElementById('zoom-fit-btn').addEventListener('click', zoomToFit);
zoomReadout.addEventListener('click', () => setZoom(1));

// ctrl/cmd + scroll wheel, or trackpad pinch (browsers report pinch as ctrl+wheel)
canvas.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0025));
  setZoom(zoom * Math.min(1.3, Math.max(0.77, factor)), e.clientX, e.clientY);
}, { passive: false });

// Safari does not report a trackpad pinch as ctrl+wheel; it sends gesture events and
// otherwise zooms the whole page (which can only magnify, never shrink). Handle it here.
let gestureStartZoom = 1;
canvas.addEventListener('gesturestart', e => { e.preventDefault(); gestureStartZoom = zoom; });
canvas.addEventListener('gesturechange', e => { e.preventDefault(); setZoom(gestureStartZoom * e.scale, e.clientX, e.clientY); });
canvas.addEventListener('gestureend', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const a = document.activeElement;
  if (a && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
  const k = e.key, c = e.code;
  if (k === '=' || k === '+' || c === 'Equal' || c === 'NumpadAdd') { e.preventDefault(); setZoom(zoom * 1.2); }
  else if (k === '-' || k === '_' || c === 'Minus' || c === 'NumpadSubtract') { e.preventDefault(); setZoom(zoom / 1.2); }
  else if (k === '0' || c === 'Digit0') { e.preventDefault(); setZoom(1); }
  else if (k === '1' || c === 'Digit1') { e.preventDefault(); zoomToFit(); }
});

aspectBtn.addEventListener('click', () => { lockAspect = !lockAspect; aspectBtn.classList.toggle('active', lockAspect); });
labelsBtn.classList.add('active'); canvas.classList.add('labels-on');
labelsBtn.addEventListener('click', () => {
  showLabels = !showLabels;
  labelsBtn.classList.toggle('active', showLabels);
  canvas.classList.toggle('labels-on', showLabels);
});

document.getElementById('swatches').addEventListener('click', e => {
  const sw = e.target.closest('.swatch'); if (!sw) return;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active'); canvas.style.background = sw.dataset.color;
  customBg.value = sw.dataset.color; updateDotGrid(sw.dataset.color);
  setBoardBg(sw.dataset.color);
});
customBg.addEventListener('input', () => {
  canvas.style.background = customBg.value;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  updateDotGrid(customBg.value);
  setBoardBg(customBg.value);
});
function setBoardBg(color) {
  if (!activeBoardId) return;
  const b = boards.find(b=>b.id===activeBoardId);
  if (b) b.bg = color;
  if (liveMode) Live.setBg(activeBoardId, color); else saveToStorage();
}

function updateDotGrid(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const light=(r*299+g*587+b*114)/1000>128;
  canvas.classList.toggle('light-bg', light);
  world.querySelector('.dot-grid').style.backgroundImage = light
    ? 'radial-gradient(circle,rgba(0,0,0,0.12) 1px,transparent 1px)'
    : 'radial-gradient(circle,rgba(255,255,255,0.1) 1px,transparent 1px)';
}

function updateCount() {
  const imgs = nodes.filter(n=>n.classList.contains('img-node')).length;
  const txts = nodes.filter(n=>n.classList.contains('text-node')).length;
  const parts = [];
  if (imgs) parts.push(`${imgs} image${imgs>1?'s':''}`);
  if (txts) parts.push(`${txts} text${txts>1?' boxes':' box'}`);
  countEl.textContent = parts.join(' · ');
  dropHint.style.opacity = nodes.length===0 ? '1' : '0';
}

function selectNode(el) {
  if (selected && selected !== el) selected.classList.remove('selected');
  selected = el; el.classList.add('selected'); el.style.zIndex = Date.now();
  if (liveMode) Live.pushItem(el);
}

// Deselect on canvas/world background click
canvas.addEventListener('mousedown', e => {
  const t = e.target;
  // Middle-click or space+drag: start panning
  if (e.button === 1 || (spaceDown && e.button === 0)) {
    e.preventDefault();
    panDrag = { startX: e.clientX + canvas.scrollLeft, startY: e.clientY + canvas.scrollTop };
    canvas.classList.add('panning');
    return;
  }
  if (!t.closest('.canvas-node')) {
    if (selected) { selected.classList.remove('selected'); selected = null; }
  }
});

// Space key for pan mode
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.isContentEditable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
    spaceDown = true;
    canvas.classList.add('pan-ready');
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    canvas.classList.remove('pan-ready');
  }
});

function attachDragResize(el, isText) {
  ['tl','tr','bl','br'].forEach(cls => {
    el.querySelector('.resize-handle.'+cls).addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault(); selectNode(el);
      const sr = el.querySelector('.size-readout');
      resize = { el, cls, startX:e.clientX, startY:e.clientY, startW:el.offsetWidth, startH:el.offsetHeight, startL:el.offsetLeft, startT:el.offsetTop, ar:el._ar||null, sizeReadout:sr, isText };
    });
  });
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('resize-handle')) return;
    if (e.target.closest('.action-bar,.text-format-bar')) return;
    if (e.target.classList.contains('text-content') || e.target.closest('.text-content')) return;
    e.preventDefault(); selectNode(el);
    const w = toWorld(e.clientX, e.clientY);
    drag = { el, offX: w.x - el.offsetLeft, offY: w.y - el.offsetTop };
  });
}

window.addEventListener('mousemove', e => {
  if (panDrag) {
    canvas.scrollLeft = panDrag.startX - e.clientX;
    canvas.scrollTop = panDrag.startY - e.clientY;
    return;
  }
  if (drag) {
    const w = toWorld(e.clientX, e.clientY);
    const x = w.x - drag.offX;
    const y = w.y - drag.offY;
    drag.el.style.left = Math.max(0, x) + 'px';
    drag.el.style.top  = Math.max(0, y) + 'px';
  }
  if (resize) {
    const {el,cls,startX,startY,startW,startH,startL,startT,ar,sizeReadout,isText}=resize;
    const dx=(e.clientX-startX)/zoom, dy=(e.clientY-startY)/zoom, minW=80, minH=isText?36:60;
    let w=startW,h=startH,l=startL,t=startT;
    const useAr=lockAspect&&ar&&!isText;
    if      (cls==='br'){w=Math.max(minW,startW+dx);h=useAr?w*ar:Math.max(minH,startH+dy);}
    else if (cls==='bl'){w=Math.max(minW,startW-dx);h=useAr?w*ar:Math.max(minH,startH+dy);l=startL+(startW-w);}
    else if (cls==='tr'){w=Math.max(minW,startW+dx);h=useAr?w*ar:Math.max(minH,startH-dy);t=startT+(startH-h);}
    else if (cls==='tl'){w=Math.max(minW,startW-dx);h=useAr?w*ar:Math.max(minH,startH-dy);l=startL+(startW-w);t=startT+(startH-h);}
    el.style.width=w+'px'; el.style.left=l+'px'; el.style.top=t+'px';
    if(!isText) el.style.height=h+'px';
    if(sizeReadout) sizeReadout.textContent=`${Math.round(w)} × ${Math.round(el.offsetHeight)}`;
  }
});
window.addEventListener('mouseup', () => {
  if (panDrag) { panDrag = null; canvas.classList.remove('panning'); }
  const moved = drag ? drag.el : (resize ? resize.el : null);
  drag=null; resize=null;
  if (moved) notifyNodeChanged(moved);
  if (activeBoardId && !liveMode) { captureBoard(activeBoardId); saveToStorage(); }
});

// Prevent default middle-click scroll behavior
canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') return; // handled above
  if ((e.key==='Delete'||e.key==='Backspace') && selected) {
    const a=document.activeElement;
    if (a&&(a.isContentEditable||a.tagName==='INPUT'||a.tagName==='SELECT')) return;
    const id = selected.dataset.id;
    removeNodeEl(selected);
    notifyNodeRemoved(id);
    if (activeBoardId && !liveMode) { captureBoard(activeBoardId); saveToStorage(); }
  }
});

// ── IMAGE NODE ────────────────────────────
function makeImageNode(src, filename, opts={}) {
  const W=opts.w||240, H=opts.h||180, margin=50;
  const x = opts.x !== undefined ? opts.x : canvas.scrollLeft/zoom + margin + Math.random()*Math.max(0, canvas.clientWidth/zoom-W-margin*2);
  const y = opts.y !== undefined ? opts.y : canvas.scrollTop/zoom  + margin + Math.random()*Math.max(0, canvas.clientHeight/zoom-H-margin*2);
  const el = document.createElement('div');
  el.className='canvas-node img-node';
  el.dataset.id = opts.id || uid();
  el.style.cssText=`left:${x}px;top:${y}px;width:${W}px;height:${H}px;`;
  el._ar=H/W;
  const label=opts.label!==undefined?opts.label:(filename?filename.replace(/\.[^.]+$/,''):'image');
  el.innerHTML=`
    <div class="action-bar">
      <span class="size-readout">${Math.round(W)} × ${Math.round(H)}</span>
      <div class="sep"></div><button class="flip-btn">flip</button>
      <div class="sep"></div><button class="del-btn">remove</button>
    </div>
    <div class="img-inner">
      <div class="img-frame"><img src="${src}" draggable="false"></div>
      <div class="resize-handle tl"></div><div class="resize-handle tr"></div>
      <div class="resize-handle bl"></div><div class="resize-handle br"></div>
    </div>
    <div class="img-label" contenteditable="false" spellcheck="false">${label}</div>`;
  const img=el.querySelector('img');
  img.addEventListener('load',()=>{el._ar=img.naturalHeight/img.naturalWidth;});
  if(opts.flipped) el.querySelector('.img-frame').style.transform='scaleX(-1)';
  const labelEl=el.querySelector('.img-label');
  labelEl.addEventListener('dblclick',e=>{e.stopPropagation();labelEl.contentEditable='true';labelEl.focus();const r=document.createRange();r.selectNodeContents(labelEl);window.getSelection().removeAllRanges();window.getSelection().addRange(r);});
  labelEl.addEventListener('blur',()=>{labelEl.contentEditable='false';notifyNodeChanged(el);});
  labelEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();labelEl.blur();}});
  labelEl.addEventListener('mousedown',e=>{if(labelEl.contentEditable==='true')e.stopPropagation();});
  el.querySelector('.del-btn').addEventListener('mousedown',e=>{e.stopPropagation();const id=el.dataset.id;removeNodeEl(el);notifyNodeRemoved(id);if(!liveMode){captureBoard(activeBoardId);saveToStorage();}});
  let flipped=opts.flipped||false;
  el.querySelector('.flip-btn').addEventListener('mousedown',e=>{e.stopPropagation();flipped=!flipped;el.querySelector('.img-frame').style.transform=flipped?'scaleX(-1)':'';notifyNodeChanged(el);});
  attachDragResize(el,false);
  world.appendChild(el);nodes.push(el);
  if(!opts.silent){ selectNode(el); notifyNodeChanged(el, true); }
  updateCount();
  return el;
}

function restoreImageNode(item) {
  makeImageNode(item.src, null, { id:item.id, x:item.x, y:item.y, w:item.w, h:item.h, label:item.label, flipped:item.flipped, silent:true });
  if (item.z) nodes[nodes.length-1].style.zIndex = item.z;
}

  if(opts.fontFamily){content.style.fontFamily=opts.fontFamily;const opt=[...fontFamilySel.options].find(o=>o.value===opts.fontFamily);if(opt)opt.selected=true;}
  if(opts.fontWeight){content.style.fontWeight=opts.fontWeight;}
  if(opts.fontStyle){content.style.fontStyle=opts.fontStyle;}

  if(opts.bgColor&&opts.bgColor!=='transparent'){textBorder.style.background=opts.bgColor;bgColorInp.value=opts.bgColor;bgToggleBtn.classList.add('active');}

  let isBold=opts.fontWeight==='700', isItalic=opts.fontStyle==='italic', bgOn=opts.bgColor&&opts.bgColor!=='transparent';
  if(isBold) boldBtn.classList.add('active');
  if(isItalic) italicBtn.classList.add('active');

  const notify=()=>notifyNodeChanged(el);
  let inputTimer=null;
  fontFamilySel.addEventListener('change',()=>{content.style.fontFamily=fontFamilySel.value;notify();});
  fontFamilySel.addEventListener('mousedown',e=>e.stopPropagation());
  fontSizeSel.addEventListener('change',()=>{content.style.fontSize=fontSizeSel.value+'px';notify();});
  fontSizeSel.addEventListener('mousedown',e=>e.stopPropagation());
  boldBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();isBold=!isBold;content.style.fontWeight=isBold?'700':'400';boldBtn.classList.toggle('active',isBold);notify();});
  italicBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();isItalic=!isItalic;content.style.fontStyle=isItalic?'italic':'normal';italicBtn.classList.toggle('active',isItalic);notify();});

  bgColorInp.addEventListener('mousedown',e=>e.stopPropagation());
  bgToggleBtn.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();bgOn=!bgOn;textBorder.style.background=bgOn?bgColorInp.value:'transparent';bgToggleBtn.classList.toggle('active',bgOn);notify();});
  content.addEventListener('mousedown',e=>{e.stopPropagation();selectNode(el);});

  content.addEventListener('input',()=>{clearTimeout(inputTimer);inputTimer=setTimeout(notify,400);});
  content.addEventListener('blur',()=>{clearTimeout(inputTimer);notify();});
  el.querySelector('.del-btn').addEventListener('mousedown',e=>{e.stopPropagation();const id=el.dataset.id;removeNodeEl(el);notifyNodeRemoved(id);if(!liveMode){captureBoard(activeBoardId);saveToStorage();}});
  attachDragResize(el,true);
  world.appendChild(el);nodes.push(el);
  if(!opts.silent){selectNode(el);notifyNodeChanged(el,true);setTimeout(()=>content.focus(),50);}
  updateCount();
}

function restoreTextNode(item) {
  makeTextNode({ id:item.id, x:item.x, y:item.y, w:item.w, html:item.html,

// ── FILE LOADING ──────────────────────────
function readFileAsDataUrl(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(f); });
}

// Shrink big photos before they enter a board: keeps localStorage under quota and makes
// live rooms fast for a whole class. Longest side capped at MAX_IMAGE_PX; transparency kept.
const MAX_IMAGE_PX = 1600;
async function shrinkImage(dataUrl, type) {
  if (type === 'image/gif' || type === 'image/svg+xml') return dataUrl;
  let img;
  try { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; }); }
  catch(e) { return dataUrl; }
  const scale = Math.min(1, MAX_IMAGE_PX / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1 && dataUrl.length < 400000) return dataUrl;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, c.width, c.height);
  let hasAlpha = false;
  if (type === 'image/png' || type === 'image/webp') {
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    for (let i = 3; i < d.length; i += 4) { if (d[i] < 255) { hasAlpha = true; break; } }
  }
  const out = hasAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
  return out.length < dataUrl.length ? out : dataUrl;
}

async function loadFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  for (const f of imgs) {
    try {
      const raw = await readFileAsDataUrl(f);
      const src = await shrinkImage(raw, f.type);
      makeImageNode(src, f.name);
    } catch(e) { console.warn('Could not load image', f.name, e); }
  }
  if (!liveMode) { captureBoard(activeBoardId); saveToStorage(); }
}

uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{loadFiles(fileInput.files);fileInput.value='';});

    clearNodes();updateCount();
    if(liveMode) Live.clearItems(); else { captureBoard(activeBoardId);saveToStorage(); }
  }
});

canvas.addEventListener('dragenter',e=>{e.preventDefault();canvas.classList.add('drag-over');});

// ════════════════════════════════════════════════
// LIVE ROOMS  (shared boards for a class, via Firebase Realtime Database)
// ════════════════════════════════════════════════
// Data layout in the database:
//   rooms/{CODE}/meta               { name, createdAt }
//   rooms/{CODE}/boards/{boardId}   { name, bg, order }
//   rooms/{CODE}/items/{boardId}/{itemId}   one serialized node (see serializeNode)
//   rooms/{CODE}/presence/{clientId} true   (who is connected right now)
// Every client edits the same tree. Writes are per item, so dragging one image
// never re-uploads the rest of the board. Last write wins.

const ROOM_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const RECENT_ROOMS_KEY = 'constellation_recent_rooms';
let localBoardsBackup = null, localActiveBackup = null;

const Live = {
  code: null, db: null, clientId: uid(),
  roomRef: null, boardsRef: null, itemsRef: null,
  online: 0, connected: false, pushTimers: new Map(), scrollMemo: {},
  pendingBoardId: null, connCb: null,

  configured() { return !!window.FIREBASE_CONFIG; },
  available() { return this.configured() && !!(window.firebase && firebase.database); },
  init() {
    if (this.db) return;
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    this.db = firebase.database();
  },
  roomUrl(code) { return location.origin + location.pathname + '?room=' + code; },
  normalizeCode(str) { return (str || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); },

  async generateCode() {
    for (let attempt = 0; attempt < 6; attempt++) {
      let c = ''; for (let i = 0; i < 6; i++) c += ROOM_ALPHABET[Math.floor(Math.random() * ROOM_ALPHABET.length)];
      const snap = await this.db.ref('rooms/' + c + '/meta').once('value');
      if (!snap.exists()) return c;
    }
    throw new Error('Could not find a free room code, please try again.');
  },

  // Create a new room seeded with one board, then join it.
  async create(board) {
    this.init();
    const code = await this.generateCode();
    const items = {};
    (board.items || []).forEach(it => { const id = it.id || uid(); items[id] = { ...it, id }; });
    await this.db.ref('rooms/' + code).set({
      meta: { name: board.name, createdAt: Date.now() },
      boards: { [board.id]: { name: board.name, bg: board.bg || '#141414', order: Date.now() } },
      items: { [board.id]: items }
    });
    await this.join(code, board.id);
    return code;
  },

  async join(code, preferredBoardId) {
    this.init();
    code = this.normalizeCode(code);
    if (!code) throw new Error('Enter a room code.');
    const snap = await this.db.ref('rooms/' + code + '/boards').once('value');
    if (!snap.exists()) throw new Error('No room with code ' + code + '.');

    if (liveMode) this.leave({ silent: true });
    else { saveToStorage(); localBoardsBackup = boards; localActiveBackup = activeBoardId; }

    liveMode = true;
    this.code = code;
    this.pendingBoardId = preferredBoardId || null;
    this.roomRef = this.db.ref('rooms/' + code);
    this.boardsRef = this.roomRef.child('boards');
    boards = []; activeBoardId = null;
    clearNodes(); updateCount();

    this.boardsRef.on('value', s => this.onBoards(s));

    this.connCb = s => {
      this.connected = !!s.val();
      if (this.connected && this.roomRef) {
        const me = this.roomRef.child('presence/' + this.clientId);
        me.onDisconnect().remove();
        me.set(true);
      }
      updateLiveUI();
    };
    this.db.ref('.info/connected').on('value', this.connCb);
    this.roomRef.child('presence').on('value', s => { this.online = s.numChildren(); updateLiveUI(); });

    history.replaceState(null, '', this.roomUrl(code));
    rememberRoom(code);
    updateLiveUI();
  },

  leave(opts = {}) {
    if (!liveMode) return;
    if (this.itemsRef) this.itemsRef.off();
    if (this.boardsRef) this.boardsRef.off();
    if (this.roomRef) {
      this.roomRef.child('presence').off();
      this.roomRef.child('presence/' + this.clientId).remove();
    }
    if (this.connCb) this.db.ref('.info/connected').off('value', this.connCb);
    this.pushTimers.forEach(t => clearTimeout(t)); this.pushTimers.clear();
    this.itemsRef = this.boardsRef = this.roomRef = this.connCb = null;
    this.code = null; this.online = 0; this.connected = false; this.scrollMemo = {};
    liveMode = false;
    if (opts.silent) return; // caller is about to join another room

    boards = (localBoardsBackup && localBoardsBackup.length) ? localBoardsBackup : [defaultBoard('Board 1')];
    activeBoardId = (localActiveBackup && boards.find(b => b.id === localActiveBackup)) ? localActiveBackup : boards[0].id;
    localBoardsBackup = null; localActiveBackup = null;
    restoreBoard(boards.find(b => b.id === activeBoardId));
    renderTabs();
    history.replaceState(null, '', location.pathname);
    updateLiveUI();
  },

  // ── boards list ──
  onBoards(snap) {
    const list = [];
    snap.forEach(c => {
      const v = c.val() || {};
      list.push({ id: c.key, name: v.name || 'Board', bg: v.bg || '#141414', order: v.order || 0, items: [] });
    });
    list.sort((a, b) => a.order - b.order);
    boards = list;
    if (!boards.length) {
      // Someone deleted the last board out from under us. Keep the room usable.
      const id = uid();
      this.boardsRef.child(id).set({ name: 'Board 1', bg: '#141414', order: Date.now() });
      return;
    }
    const active = boards.find(b => b.id === activeBoardId);
    if (!active) {
      const want = this.pendingBoardId && boards.find(b => b.id === this.pendingBoardId) ? this.pendingBoardId : boards[0].id;
      this.pendingBoardId = null;
      this.enterBoard(want);
    } else {
      applyBoardBg(active.bg);
      renderTabs();
    }
  },

  enterBoard(boardId) {
    if (activeBoardId) this.scrollMemo[activeBoardId] = { x: canvas.scrollLeft, y: canvas.scrollTop };
    if (this.itemsRef) this.itemsRef.off();
    this.pushTimers.forEach(t => clearTimeout(t)); this.pushTimers.clear();
    clearNodes(); updateCount();
    activeBoardId = boardId;
    const b = boards.find(x => x.id === boardId);
    if (b) applyBoardBg(b.bg);
    const sc = this.scrollMemo[boardId] || { x: 0, y: 0 };
    requestAnimationFrame(() => { canvas.scrollLeft = sc.x; canvas.scrollTop = sc.y; });

    this.itemsRef = this.roomRef.child('items/' + boardId);
    this.itemsRef.on('child_added',   s => this.onItem(s.key, s.val()));
    this.itemsRef.on('child_changed', s => this.onItem(s.key, s.val()));
    this.itemsRef.on('child_removed', s => { const el = nodeById(s.key); if (el) removeNodeEl(el); });
    renderTabs();
  },

  // ── incoming item changes ──
  onItem(id, item) {
    if (!item || !item.type) return;
    item = { ...item, id };
    const el = nodeById(id);
    if (!el) { restoreItem(item); return; }
    if ((drag && drag.el === el) || (resize && resize.el === el)) return; // we are moving it right now
    const cur = serializeNode(el);
    const GEOM = ['x', 'y', 'w', 'h', 'z'];
    const contentChanged = Object.keys(item).some(k => k !== 'id' && !GEOM.includes(k) && item[k] !== cur[k]);
    if (contentChanged) {
      if (el.contains(document.activeElement)) return; // someone is typing in it here; our next push wins
      const wasSelected = selected === el;
      removeNodeEl(el);
      restoreItem(item);
      const fresh = nodeById(id);
      if (wasSelected && fresh) { selected = fresh; fresh.classList.add('selected'); }
    } else {
      if (item.x !== cur.x) el.style.left = item.x + 'px';
      if (item.y !== cur.y) el.style.top = item.y + 'px';
      if (item.w !== cur.w) el.style.width = item.w + 'px';
      if (item.type === 'image' && item.h !== cur.h) el.style.height = item.h + 'px';
      if (item.z !== cur.z) el.style.zIndex = item.z || 0;
      const sr = el.querySelector('.size-readout');
      if (sr) sr.textContent = `${Math.round(el.offsetWidth)} × ${Math.round(el.offsetHeight)}`;
    }
  },

  // ── outgoing item changes ──
  pushItem(el, isNew) {
    if (!this.itemsRef) return;
    const id = el.dataset.id;
    if (isNew) el._needsFullPush = true;
    const ref = this.itemsRef; // bind to the board that was active when the edit happened
    clearTimeout(this.pushTimers.get(id));
    this.pushTimers.set(id, setTimeout(() => {
      this.pushTimers.delete(id);
      if (!nodes.includes(el)) return;
      const item = serializeNode(el);
      if (!item) return;
      if (el._needsFullPush) { el._needsFullPush = false; ref.child(id).set(item); return; }
      if (item.type === 'image') delete item.src; // never re-upload pixels for a move
      ref.child(id).update(item);
    }, 60));
  },
  removeItem(id) {
    clearTimeout(this.pushTimers.get(id)); this.pushTimers.delete(id);
    if (this.itemsRef) this.itemsRef.child(id).remove();
  },
  clearItems() { if (this.itemsRef) this.itemsRef.set(null); },

  // ── board operations ──
  addBoard() {
    const id = uid();
    this.boardsRef.child(id).set({ name: `Board ${boards.length + 1}`, bg: '#141414', order: Date.now() });
    this.enterBoard(id);
  },
  deleteBoard(id) {
    this.boardsRef.child(id).remove();
    this.roomRef.child('items/' + id).remove();
  },
  renameBoard(id, name) { this.boardsRef.child(id).update({ name }); },
  setBg(id, bg) { this.boardsRef.child(id).update({ bg }); },
  duplicateBoard() {
    const src = boards.find(b => b.id === activeBoardId);
    if (!src) return;
    const newId = uid();
    const items = {};
    serializeNodes().forEach(it => { const nid = uid(); items[nid] = { ...it, id: nid }; });
    this.roomRef.child('items/' + newId).set(items);
    this.boardsRef.child(newId).set({ name: src.name + ' copy', bg: src.bg || '#141414', order: Date.now() });
    this.enterBoard(newId);
  },
  importBoards(list) {
    let last = null, order = Date.now();
    list.forEach(b => {
      const newId = uid();
      const items = {};
      (b.items || []).forEach(it => { const nid = uid(); items[nid] = { ...it, id: nid }; });
      this.roomRef.child('items/' + newId).set(items);
      this.boardsRef.child(newId).set({ name: b.name || 'Imported', bg: b.bg || '#141414', order: order++ });
      last = newId;
    });
    if (last) this.enterBoard(last);
  },
  // For "Export All": load every board's items, not just the one on screen.
  async fillAllBoardItems() {
    const snap = await this.roomRef.child('items').once('value');
    const all = snap.val() || {};
    boards.forEach(b => {
      if (b.id === activeBoardId) return;
      b.items = Object.values(all[b.id] || {}).sort((a, c) => (a.z || 0) - (c.z || 0));
    });
  }
};

function rememberRoom(code) {
  try {
    const list = JSON.parse(localStorage.getItem(RECENT_ROOMS_KEY) || '[]').filter(r => r.code !== code);
    list.unshift({ code, at: Date.now() });
    localStorage.setItem(RECENT_ROOMS_KEY, JSON.stringify(list.slice(0, 6)));
  } catch(e) {}
}
function recentRooms() { try { return JSON.parse(localStorage.getItem(RECENT_ROOMS_KEY) || '[]'); } catch(e) { return []; } }

function copyText(text, btn) {
  const done = () => { if (btn) { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => prompt('Copy this link:', text));
  else prompt('Copy this link:', text);
}

// ── live bar ──
const liveBar = document.getElementById('live-bar');
const shareBtn = document.getElementById('share-btn');
function updateLiveUI() {
  liveBar.classList.toggle('on', liveMode);
  shareBtn.classList.toggle('live', liveMode);
  shareBtn.textContent = liveMode ? 'Live · ' + Live.code : 'Share';
  if (!liveMode) return;
  document.getElementById('live-code').textContent = Live.code;
  document.getElementById('live-link').textContent = Live.roomUrl(Live.code);
  const st = document.getElementById('live-status');
  if (Live.connected) { st.textContent = Live.online + ' online'; st.classList.remove('offline'); }
  else { st.textContent = 'reconnecting…'; st.classList.add('offline'); }
}
document.getElementById('live-copy-btn').addEventListener('click', e => copyText(Live.roomUrl(Live.code), e.target));
document.getElementById('live-leave-btn').addEventListener('click', () => Live.leave());

// ── share modal ──
const shareOverlay = document.getElementById('share-overlay');
const shareModal = document.getElementById('share-modal');
function openShareModal() { renderShareModal(); shareOverlay.classList.add('open'); }
function closeShareModal() { shareOverlay.classList.remove('open'); }
shareOverlay.addEventListener('click', e => { if (e.target === shareOverlay) closeShareModal(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && shareOverlay.classList.contains('open')) closeShareModal(); });
shareBtn.addEventListener('click', openShareModal);

function esc(str) { return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderShareModal() {
  const setupHtml = `
    <h3>Set up live sharing</h3>
    <p>Live rooms need a free Firebase database so every laptop in the room can read and write the same board. One-time setup, about five minutes:</p>
    <ol>
      <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and create a project.</li>
      <li>Build → Realtime Database → Create database → start in <b>test mode</b>.</li>
      <li>Project settings → Your apps → Web (<code>&lt;/&gt;</code>) → register the app → copy the <code>firebaseConfig</code> object.</li>
      <li>Paste it into <code>firebase-config.js</code> next to <code>index.html</code>, save, and publish (commit and push).</li>
    </ol>
    <p>Full instructions and the recommended database rules are in the project README.</p>
    <div class="modal-btns"><button class="primary" id="share-close">Close</button></div>`;

  const noLibHtml = `
    <h3>Live sharing unavailable</h3>
    <p>The Firebase library did not load. Check the internet connection, or whether the school network blocks <code>gstatic.com</code> and <code>firebaseio.com</code>, then reload the page.</p>
    <div class="modal-btns"><button class="primary" id="share-close">Close</button></div>`;

  const cur = boards.find(b => b.id === activeBoardId);
  const recents = recentRooms().filter(r => r.code !== Live.code);
  const recentHtml = recents.length ? `
    <div class="share-section">
      <h4>Recent rooms</h4>
      <div class="recent">${recents.map(r => `<button data-join="${esc(r.code)}">${esc(r.code)}</button>`).join('')}</div>
    </div>` : '';

  const idleHtml = `
    <h3>Share with a class</h3>
    <div class="share-section first">
      <h4>Start a live room from “${esc(cur ? cur.name : 'this board')}”</h4>
      <p>You get a short code and a link. Anyone who opens the link sees the board and can add, move, and edit alongside everyone else, in real time. The room stays saved online for next lesson.</p>
      <button class="primary" id="share-create">Create room</button>
    </div>
    <div class="share-section">
      <h4>Join a room</h4>
      <div class="row"><input type="text" id="share-code" placeholder="ROOM CODE" maxlength="12" autocomplete="off"><button class="primary" id="share-join">Join</button></div>
    </div>
    ${recentHtml}
    <div class="share-error" id="share-error"></div>
    <div class="modal-btns"><button id="share-close">Cancel</button></div>`;

  const liveHtml = `
    <h3>Live room</h3>
    <div class="big-code">${esc(Live.code || '')}</div>
    <p style="text-align:center">Students open this link, or open the board and enter the code under Share → Join.</p>
    <div class="share-link" id="share-link-text">${esc(Live.roomUrl(Live.code || ''))}</div>
    <div class="row" style="justify-content:center">
      <button id="share-copy">Copy link</button>
      <button id="share-copy-code">Copy code</button>
    </div>
    <div class="share-section" style="margin-top:14px">
      <p>Leaving takes you back to your own boards. The room and everything on it stays online, and you can rejoin with the code any time.</p>
      <div class="modal-btns">
        <button class="danger" id="share-leave">Leave room</button>
        <button class="primary" id="share-close">Done</button>
      </div>
    </div>`;

  shareModal.innerHTML = !Live.configured() ? setupHtml : (!Live.available() ? noLibHtml : (liveMode ? liveHtml : idleHtml));

  const $ = id => shareModal.querySelector('#' + id);
  const errEl = $('share-error');
  const showErr = msg => { if (errEl) errEl.textContent = msg; else alert(msg); };
  const busy = (btn, on) => { if (!btn) return; btn.disabled = on; btn.textContent = on ? 'Please wait…' : btn.dataset.label; };

  if ($('share-close')) $('share-close').addEventListener('click', closeShareModal);
  if ($('share-leave')) $('share-leave').addEventListener('click', () => { Live.leave(); closeShareModal(); });
  if ($('share-copy')) $('share-copy').addEventListener('click', e => copyText(Live.roomUrl(Live.code), e.target));
  if ($('share-copy-code')) $('share-copy-code').addEventListener('click', e => copyText(Live.code, e.target));

  const createBtn = $('share-create');
  if (createBtn) {
    createBtn.dataset.label = createBtn.textContent;
    createBtn.addEventListener('click', async () => {
      busy(createBtn, true);
      try {
        captureBoard(activeBoardId);
        const board = JSON.parse(JSON.stringify(boards.find(b => b.id === activeBoardId)));
        await Live.create(board);
        renderShareModal();
      } catch(err) { console.error(err); showErr(friendlyError(err)); busy(createBtn, false); }
    });
  }
  const joinBtn = $('share-join'), codeInp = $('share-code');
  const doJoin = async code => {
    busy(joinBtn, true);
    try { await Live.join(code); closeShareModal(); }
    catch(err) { console.error(err); showErr(friendlyError(err)); busy(joinBtn, false); }
  };
  if (joinBtn) {
    joinBtn.dataset.label = joinBtn.textContent;
    joinBtn.addEventListener('click', () => doJoin(codeInp.value));
    codeInp.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(codeInp.value); });
    setTimeout(() => codeInp.focus(), 50);
  }
  shareModal.querySelectorAll('[data-join]').forEach(b => b.addEventListener('click', () => doJoin(b.dataset.join)));
}

function friendlyError(err) {
  const m = (err && err.message) || String(err);
  if (/permission_denied|permission denied/i.test(m)) return 'The database refused the request. Check the Realtime Database rules in the Firebase console (see README).';
  return m;
}

// ════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════
loadFromStorage();
activeBoardId = boards[0].id;
restoreBoard(boards[0]);
renderTabs();
updateLiveUI();

// Opened from a share link? Join straight away.
(function autoJoin() {
  const code = new URLSearchParams(location.search).get('room');
  if (!code) return;
  if (!Live.available()) { openShareModal(); return; }
  Live.join(code).catch(err => {
    console.error(err);
    history.replaceState(null, '', location.pathname);
    openShareModal();
    const e = shareModal.querySelector('#share-error');
    if (e) e.textContent = friendlyError(err);
  });
})();
</script>
</body>
</html>
